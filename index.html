<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لحظة | LAHZA</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#090914;
  color:white;
  text-align:center;
}
header{
  padding:22px;
  font-size:27px;
  font-weight:bold;
  color:#ff5d91;
}
.hero{
  padding:80px 20px;
}
.hero h1{
  font-size:48px;
  margin:0 0 20px;
}
.hero h1 span{color:#ff5d91}
.hero p{
  color:#ccc;
  font-size:19px;
  line-height:1.8;
}
button{
  margin-top:25px;
  background:#ff4f87;
  color:white;
  border:0;
  padding:15px 35px;
  border-radius:12px;
  font-size:18px;
  cursor:pointer;
}
.cards{
  background:#fff;
  color:#171722;
  padding:55px 20px;
}
.cards h2{font-size:28px}
.options{
  display:flex;
  justify-content:center;
  gap:15px;
  flex-wrap:wrap;
  margin-top:30px;
}
.card{
  width:150px;
  padding:25px 10px;
  border:1px solid #eee;
  border-radius:18px;
  font-size:17px;
  background:#fff8fa;
}
.card .emoji{
  font-size:35px;
  margin-bottom:10px;
}
footer{
  padding:30px;
  color:#888;
}
@media(max-width:600px){
  .hero h1{font-size:36px}
}
</style>
</head>

<body>

<header>LAHZA ♡ لحظة</header>

<section class="hero">
  <h1>اصنع <span>لحظة</span> لن تُنسى</h1>
  <p>
    حوّل صورك ورسالتك وذكرياتك إلى<br>
    مفاجأة رقمية لشخص غالي عليك 🤍
  </p>

  <button onclick="document.getElementById('occasions').scrollIntoView({behavior:'smooth'})">
    اصنع لحظتك ♡
  </button>
</section>

<section class="cards" id="occasions">
  <h2>اختر مناسبتك 💗</h2>

  <div class="options">
    <div class="card">
      <div class="emoji">❤️</div>
      حب
    </div>

    <div class="card">
      <div class="emoji">🫂</div>
      صداقة
    </div>

    <div class="card">
      <div class="emoji">🎂</div>
      عيد ميلاد
    </div>

    <div class="card">
      <div class="emoji">🎓</div>
      تخرج
    </div>

    <div class="card">
      <div class="emoji">🎁</div>
      مفاجأة
    </div>
  </div>
</section>

<footer>
  LAHZA © 2026 — لحظة تبقى 🤍
</footer>

</body>
</html>
