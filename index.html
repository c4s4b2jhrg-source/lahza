<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#08080f">
<title>LAHZA | لحظة</title>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  background:#08080f;
  color:white;
  min-height:100vh;
  overflow:hidden;
}

.page{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  position:relative;
  overflow:hidden;
}

nav{
  width:100%;
  max-width:1000px;
  margin:auto;
  padding:22px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  position:relative;
  z-index:2;
}

.logo{
  font-size:24px;
  font-weight:900;
}

.logo span{color:#ff4f87}

.about{
  color:#999;
  font-size:13px;
}

.hero{
  flex:1;
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
  padding:20px;
  position:relative;
  z-index:2;
}

.content{
  max-width:700px;
}

.tag{
  display:inline-block;
  background:#15151e;
  border:1px solid #292934;
  padding:9px 15px;
  border-radius:100px;
  color:#ccc;
  font-size:13px;
  margin-bottom:25px;
}

h1{
  font-size:clamp(45px,10vw,80px);
  line-height:1.08;
  margin:0;
}

.pink{
  color:#ff4f87;
}

p{
  max-width:560px;
  margin:25px auto;
  color:#999;
  line-height:1.9;
  font-size:17px;
}

.start{
  display:inline-block;
  border:0;
  background:linear-gradient(135deg,#ff3474,#ff6999);
  color:white;
  font-size:17px;
  font-weight:800;
  padding:17px 34px;
  border-radius:16px;
  text-decoration:none;
  box-shadow:0 15px 45px rgba(255,79,135,.28);
}

.note{
  display:block;
  margin-top:15px;
  color:#555;
  font-size:12px;
}

.glow1,
.glow2{
  position:absolute;
  border-radius:50%;
  filter:blur(130px);
  pointer-events:none;
}

.glow1{
  width:330px;
  height:330px;
  background:#ff2e73;
  opacity:.18;
  top:15%;
  right:-100px;
}

.glow2{
  width:300px;
  height:300px;
  background:#763cff;
  opacity:.12;
  bottom:-80px;
  left:-100px;
}

footer{
  text-align:center;
  padding:20px;
  color:#444;
  font-size:12px;
  position:relative;
  z-index:2;
}

@media(max-width:600px){
  nav{padding:20px}
  .about{display:none}
  p{font-size:16px}
}
</style>
</head>

<body>

<div class="page">

  <div class="glow1"></div>
  <div class="glow2"></div>

  <nav>
    <div class="logo">
      <span>♡</span> LAHZA
    </div>

    <div class="about">
      لحظة تبقى 🤍
    </div>
  </nav>

  <main class="hero">

    <div class="content">

      <div class="tag">
        💌 هدية مختلفة لشخص مختلف
      </div>

      <h1>
        مو كل هدية<br>
        تنحط في <span class="pink">علبة.</span>
      </h1>

      <p>
        اجمع رسالتك وصوركم وأغنيتكم وذكرياتكم
        في تجربة رقمية خاصة، وأرسلها برابط واحد.
      </p>

     <a href="./occasion.html" class="start">
        ابدأ لحظتك ♡
      </a>

      <span class="note">
        ما يحتاج تطبيق • يستلمها برابط خاص
      </span>

    </div>

  </main>

  <footer>
    LAHZA © 2026
  </footer>

</div>

</body>
</html>
