<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#08080f"
  >

  <title>LAHZA | لحظة</title>

  <style>

    *{
      box-sizing:border-box;
      -webkit-tap-highlight-color:transparent;
    }

    html{
      background:#08080f;
      min-height:100%;
    }

    body{
      margin:0;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

      background:#08080f;
      color:white;

      min-height:100vh;
      min-height:100dvh;

      overflow-x:hidden;
      overflow-y:auto;

      -webkit-font-smoothing:antialiased;
    }


    .page{
      min-height:100vh;
      min-height:100dvh;

      display:flex;
      flex-direction:column;

      position:relative;
      overflow:hidden;

      background:
        radial-gradient(
          circle at 100% 25%,
          rgba(255,46,115,.09),
          transparent 35%
        ),
        radial-gradient(
          circle at 0% 90%,
          rgba(118,60,255,.07),
          transparent 35%
        ),
        #08080f;
    }


    nav{
      width:100%;
      max-width:1000px;

      margin:0 auto;

      padding:
        max(20px,env(safe-area-inset-top))
        22px
        20px;

      display:flex;
      justify-content:space-between;
      align-items:center;

      position:relative;
      z-index:2;
    }


    .logo{
      font-size:24px;
      font-weight:900;
    }


    .logo span{
      color:#ff4f87;
    }


    .about{
      color:#999;
      font-size:13px;
    }


    .hero{
      flex:1;

      display:flex;
      justify-content:center;
      align-items:center;

      text-align:center;

      padding:20px;

      position:relative;
      z-index:2;
    }


    .content{
      width:100%;
      max-width:700px;
    }


    .tag{
      display:inline-block;

      background:#15151e;
      border:1px solid #292934;

      padding:9px 15px;

      border-radius:100px;

      color:#ccc;

      font-size:13px;

      margin-bottom:25px;
    }


    h1{
      font-size:clamp(45px,10vw,80px);

      line-height:1.08;

      margin:0;

      letter-spacing:-1px;
    }


    .pink{
      color:#ff4f87;
    }


    p{
      max-width:560px;

      margin:25px auto;

      color:#999;

      line-height:1.9;

      font-size:17px;
    }


    .start{
      display:inline-block;

      border:0;

      background:
        linear-gradient(
          135deg,
          #ff3474,
          #ff6999
        );

      color:white;

      font-size:17px;
      font-weight:800;

      padding:17px 34px;

      border-radius:16px;

      text-decoration:none;

      box-shadow:
        0 12px 35px
        rgba(255,79,135,.20);

      transition:
        transform .18s ease,
        opacity .18s ease;
    }


    .start:active{
      transform:scale(.97);
      opacity:.9;
    }


    .note{
      display:block;

      margin-top:15px;

      color:#555;

      font-size:12px;
    }


    /* عداد الموجودين */

    .liveCount{
      display:inline-flex;

      align-items:center;
      justify-content:center;

      gap:8px;

      margin-top:16px;

      padding:8px 13px;

      border-radius:999px;

      background:#121219;

      border:1px solid #24242e;

      color:#bdbdc7;

      font-size:12px;

      min-height:34px;
    }


    .liveDot{
      width:8px;
      height:8px;

      flex:0 0 8px;

      border-radius:50%;

      background:#31d17c;

      box-shadow:
        0 0 0 4px
        rgba(49,209,124,.10);
    }


    #publicOnline{
      min-width:150px;
    }


    /* الفوتر */

    footer{
      text-align:center;

      padding:
        20px
        20px
        max(20px,env(safe-area-inset-bottom));

      color:#444;

      font-size:12px;

      position:relative;
      z-index:2;
    }


    @media(max-width:600px){

      nav{
        padding-left:20px;
        padding-right:20px;
      }


      .about{
        display:none;
      }


      .hero{
        padding:
          10px
          20px
          20px;
      }


      p{
        font-size:16px;
      }


      .start{
        padding:16px 30px;
      }

    }


    @media(max-height:650px){

      .tag{
        margin-bottom:15px;
      }


      p{
        margin:18px auto;
      }


      h1{
        font-size:clamp(
          38px,
          9vw,
          65px
        );
      }

    }


    @media(
      prefers-reduced-motion:
      reduce
    ){

      *{
        scroll-behavior:auto !important;
        transition:none !important;
        animation:none !important;
      }

    }

  </style>
</head>


<body>

  <div class="page">

    <nav>

      <div class="logo">
        <span>♡</span>
        LAHZA
      </div>

      <div class="about">
        لحظة تبقى 🤍
      </div>

    </nav>


    <main class="hero">

      <div class="content">

        <div class="tag">
          💌 هدية مختلفة لشخص مختلف
        </div>


        <h1>

          مو كل هدية

          <br>

          تنحط في

          <span class="pink">
            علبة.
          </span>

        </h1>


        <p>
          اجمع رسالتك وصوركم وأغنيتكم وذكرياتكم
          في تجربة رقمية خاصة،
          وأرسلها برابط واحد.
        </p>


        <a
          href="./occasion.html"
          class="start"
        >
          ابدأ لحظتك ♡
        </a>


        <span class="note">
          ما يحتاج تطبيق • يستلمها برابط خاص
        </span>


        <div
          class="liveCount"
          id="liveCount"
        >

          <span class="liveDot"></span>

          <span id="publicOnline">
            جاري معرفة الموجودين الآن...
          </span>

        </div>

      </div>

    </main>


    <footer>
      LAHZA © 2026
    </footer>

  </div>


  <!--
    defer:
    يخلي Safari يعرض الصفحة أول
    وبعدها يشغل نظام الزوار
  -->

  <script
    src="./analytics.js"
    defer
  ></script>


  <script>

    /*
      ننتظر analytics.js بدون
      تعطيل ظهور الصفحة
    */

    let analyticsAttempts = 0;


    function startOnlineCounter(){

      if(
        !window.LahzaAnalytics
      ){

        analyticsAttempts++;


        if(
          analyticsAttempts < 20
        ){

          setTimeout(
            startOnlineCounter,
            250
          );

        }

        else{

          const text =
            document.getElementById(
              "publicOnline"
            );


          if(text){

            text.textContent =
              "لحظات تُصنع بكل حب ♡";

          }

        }


        return;

      }


      refreshPublicOnline();


      setInterval(
        refreshPublicOnline,
        30000
      );

    }


    async function refreshPublicOnline(){

      const text =
        document.getElementById(
          "publicOnline"
        );


      if(!text){
        return;
      }


      try{

        const stats =
          await window
            .LahzaAnalytics
            .getStats();


        const online =
          Number(
            stats?.online_now || 0
          );


        if(online <= 0){

          text.textContent =
            "أنت أول شخص موجود الآن ♡";

        }

        else if(online === 1){

          text.textContent =
            "معك الآن شخص واحد يصنع لحظته بكل حب ♡";

        }

        else{

          /*
            en-US عشان الرقم:
            2 3 4
            مو:
            ٢ ٣ ٤
          */

          const number =
            online.toLocaleString(
              "en-US"
            );


          text.textContent =
            `معك الآن ${number} أشخاص يصنعون لحظاتهم بكل حب ♡`;

        }

      }

      catch(error){

        console.warn(
          "LAHZA online counter:",
          error
        );


        text.textContent =
          "لحظات تُصنع بكل حب ♡";

      }

    }


    /*
      الصفحة تظهر أول.
      بعدها نشغل العداد.
    */

    if(
      document.readyState ===
      "loading"
    ){

      document.addEventListener(
        "DOMContentLoaded",
        () => {

          setTimeout(
            startOnlineCounter,
            700
          );

        },
        {
          once:true
        }
      );

    }

    else{

      setTimeout(
        startOnlineCounter,
        700
      );

    }

  </script>

</body>
</html>
