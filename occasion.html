<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#08080f">
<title>اختر المناسبة | LAHZA</title>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  background:#08080f;
  color:white;
  min-height:100vh;
}

.page{
  min-height:100vh;
  display:flex;
  flex-direction:column;
}

header{
  max-width:800px;
  width:100%;
  margin:auto;
  padding:22px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  font-weight:900;
  font-size:21px;
}

.logo span{color:#ff4f87}

.back{
  color:#999;
  text-decoration:none;
  background:#15151e;
  padding:9px 14px;
  border-radius:100px;
  font-size:13px;
}

.progress{
  display:flex;
  justify-content:center;
  gap:7px;
  margin-top:5px;
}

.dot{
  width:7px;
  height:7px;
  border-radius:20px;
  background:#292933;
}

.dot.active{
  width:28px;
  background:#ff4f87;
}

main{
  width:100%;
  max-width:700px;
  margin:auto;
  padding:25px 20px 50px;
}

.title{
  text-align:center;
  margin:25px 0 35px;
}

.title h1{
  font-size:35px;
  margin:0 0 10px;
}

.title p{
  color:#777;
  margin:0;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:13px;
}

.option{
  border:1px solid #24242e;
  background:#121219;
  border-radius:20px;
  padding:25px 15px;
  color:white;
  text-align:center;
  cursor:pointer;
  transition:.2s;
}

.option:active{
  transform:scale(.97);
}

.option.selected{
  border-color:#ff4f87;
  background:#1d1118;
  box-shadow:0 0 0 1px #ff4f87;
}

.emoji{
  display:block;
  font-size:39px;
  margin-bottom:10px;
}

.name{
  font-weight:800;
  font-size:16px;
}

.desc{
  color:#666;
  font-size:12px;
  margin-top:6px;
}

.next{
  width:100%;
  border:0;
  background:#2a2a32;
  color:#777;
  border-radius:15px;
  padding:17px;
  font-size:17px;
  font-weight:800;
  margin-top:25px;
  cursor:not-allowed;
}

.next.ready{
  background:linear-gradient(135deg,#ff3474,#ff6999);
  color:white;
  cursor:pointer;
}

@media(max-width:420px){
  .option{padding:22px 10px}
  .title h1{font-size:30px}
}
</style>
</head>

<body>

<div class="page">

<header>
  <a class="back" href="index.html">← رجوع</a>

  <div class="logo">
    <span>♡</span> LAHZA
  </div>
</header>

<div class="progress">
  <div class="dot active"></div>
  <div class="dot"></div>
  <div class="dot"></div>
  <div class="dot"></div>
</div>

<main>

  <div class="title">
    <h1>وش المناسبة؟ 🤍</h1>
    <p>اختر اللحظة اللي تبي تصنعها.</p>
  </div>

  <div class="grid">

    <div class="option" onclick="selectOption(this,'love')">
      <span class="emoji">❤️</span>
      <div class="name">حب</div>
      <div class="desc">لشخص يعني لك الكثير</div>
    </div>

    <div class="option" onclick="selectOption(this,'birthday')">
      <span class="emoji">🎂</span>
      <div class="name">عيد ميلاد</div>
      <div class="desc">خله يبدأ يومه بمفاجأة</div>
    </div>

    <div class="option" onclick="selectOption(this,'friend')">
      <span class="emoji">🫂</span>
      <div class="name">صداقة</div>
      <div class="desc">لرفيق اللحظات</div>
    </div>

    <div class="option" onclick="selectOption(this,'graduation')">
      <span class="emoji">🎓</span>
      <div class="name">تخرج</div>
      <div class="desc">احتفل بإنجازه</div>
    </div>

    <div class="option" onclick="selectOption(this,'sorry')">
      <span class="emoji">🥹</span>
      <div class="name">اعتذار</div>
      <div class="desc">لما الكلام العادي ما يكفي</div>
    </div>

    <div class="option" onclick="selectOption(this,'surprise')">
      <span class="emoji">🎁</span>
      <div class="name">بدون مناسبة</div>
      <div class="desc">لأن المفاجأة ما تحتاج سبب</div>
    </div>

  </div>

  <button class="next" id="nextBtn" onclick="goNext()">
    اختر مناسبة أول
  </button>

</main>

</div>

<script>
let selected = "";

function selectOption(element,value){

  document.querySelectorAll(".option").forEach(function(item){
    item.classList.remove("selected");
  });

  element.classList.add("selected");
  selected = value;

  localStorage.setItem("lahzaOccasion",value);

  const button = document.getElementById("nextBtn");
  button.classList.add("ready");
  button.innerText = "التالي ←";
}

function goNext(){

  if(!selected){
    return;
  }

  window.location.href = "plans.html";
}
</script>

</body>
</html>
