<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#08080f">
<title>صمّم هديتك | LAHZA</title>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

body{
  margin:0;
  background:#08080f;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}

.page{
  min-height:100vh;
}

header{
  max-width:760px;
  margin:auto;
  padding:20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-size:21px;
  font-weight:900;
}

.logo span{color:#ff4f87}

.back{
  color:#999;
  text-decoration:none;
  background:#15151e;
  padding:9px 14px;
  border-radius:100px;
  font-size:13px;
}

.progress{
  display:flex;
  justify-content:center;
  gap:7px;
  margin:3px 0 20px;
}

.dot{
  width:7px;
  height:7px;
  background:#292933;
  border-radius:20px;
}

.dot.active{
  width:28px;
  background:#ff4f87;
}

main{
  max-width:650px;
  margin:auto;
  padding:10px 18px 60px;
}

.title{
  text-align:center;
  margin-bottom:25px;
}

.title h1{
  font-size:32px;
  margin:0 0 8px;
}

.title p{
  margin:0;
  color:#777;
  line-height:1.7;
}

.summary{
  background:#121219;
  border:1px solid #25252f;
  border-radius:17px;
  padding:15px;
  margin-bottom:20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.summary span{
  color:#777;
  font-size:12px;
}

.summary strong{
  color:#ff5c90;
}

.section{
  background:#111118;
  border:1px solid #23232d;
  border-radius:22px;
  padding:20px;
  margin-bottom:15px;
}

.section-title{
  font-weight:900;
  margin-bottom:15px;
  font-size:16px;
}

label{
  display:block;
  color:#aaa;
  font-size:13px;
  margin:15px 2px 7px;
}

input,textarea{
  width:100%;
  border:1px solid #2a2a35;
  background:#0b0b11;
  color:#fff;
  padding:14px;
  border-radius:13px;
  outline:none;
  font-family:inherit;
  font-size:15px;
}

input:focus,textarea:focus{
  border-color:#ff4f87;
}

textarea{
  min-height:135px;
  resize:vertical;
  line-height:1.8;
}

.counter{
  color:#555;
  font-size:11px;
  text-align:left;
  margin-top:6px;
}

.optional{
  color:#555;
  font-size:11px;
}

.themes{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}

.theme{
  height:100px;
  border-radius:16px;
  border:2px solid transparent;
  display:flex;
  align-items:flex-end;
  padding:12px;
  cursor:pointer;
  position:relative;
  overflow:hidden;
}

.theme.selected{
  border-color:#fff;
}

.theme.selected:after{
  content:"✓";
  position:absolute;
  top:9px;
  left:9px;
  width:24px;
  height:24px;
  background:#fff;
  color:#111;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
  font-weight:bold;
}

.romantic{
  background:linear-gradient(135deg,#36101f,#ff477e);
}

.midnight{
  background:linear-gradient(135deg,#08091a,#33376d);
}

.sunset{
  background:linear-gradient(135deg,#582346,#ff9b66);
}

.minimal{
  background:linear-gradient(135deg,#ddd,#777);
}

.theme b{
  text-shadow:0 2px 8px #000;
}

.upload{
  border:1px dashed #444452;
  background:#0b0b11;
  border-radius:16px;
  padding:24px 15px;
  text-align:center;
  cursor:pointer;
}

.upload-icon{
  font-size:30px;
  margin-bottom:7px;
}

.upload p{
  margin:3px;
  color:#aaa;
  font-size:13px;
}

.upload small{
  color:#555;
}

#photoInput{
  display:none;
}

.photo-info{
  color:#ff6b9a;
  font-size:12px;
  margin-top:10px;
}

.previewImages{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:7px;
  margin-top:12px;
}

.previewImages img{
  width:100%;
  aspect-ratio:1;
  object-fit:cover;
  border-radius:10px;
}

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:20px;
}

.preview-btn,.next{
  border:0;
  padding:16px 10px;
  border-radius:15px;
  font-family:inherit;
  font-size:15px;
  font-weight:900;
  cursor:pointer;
}

.preview-btn{
  background:#1b1b24;
  color:#fff;
}

.next{
  background:linear-gradient(135deg,#ff3474,#ff6999);
  color:#fff;
}

/* المعاينة */

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.94);
  z-index:100;
  overflow:auto;
}

.modal.show{
  display:block;
}

.preview-card{
  min-height:100vh;
  max-width:600px;
  margin:auto;
  padding:25px 20px 50px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  text-align:center;
}

.close{
  position:fixed;
  top:20px;
  left:20px;
  border:0;
  background:#22222b;
  color:white;
  width:42px;
  height:42px;
  border-radius:50%;
  font-size:20px;
  z-index:110;
}

.gift-heart{
  font-size:55px;
  animation:pulse 1.5s infinite;
}

@keyframes pulse{
  50%{transform:scale(1.15)}
}

.preview-card h2{
  font-size:32px;
  margin:15px 0 5px;
}

.preview-message{
  line-height:2;
  color:#ddd;
  white-space:pre-wrap;
  margin:20px auto;
  max-width:500px;
}

.preview-from{
  color:#ff6c9c;
  font-weight:bold;
}

.preview-date{
  color:#777;
  margin-top:10px;
  font-size:13px;
}

.preview-gallery{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px;
  margin-top:20px;
}

.preview-gallery img{
  width:100%;
  border-radius:15px;
  aspect-ratio:1;
  object-fit:cover;
}

@media(max-width:480px){
  .title h1{font-size:29px}
  .section{padding:17px}
}
</style>
</head>

<body>

<div class="page">

<header>
  <a href="plans.html" class="back">← رجوع</a>
  <div class="logo"><span>♡</span> LAHZA</div>
</header>

<div class="progress">
  <div class="dot"></div>
  <div class="dot"></div>
  <div class="dot active"></div>
  <div class="dot"></div>
</div>

<main>

<div class="title">
  <h1>صمّم لحظتك 🤍</h1>
  <p>هني تبدأ الهدية تصير شخصية فعلًا.</p>
</div>

<div class="summary">
  <div>
    <span>المناسبة</span><br>
    <strong id="occasionName">—</strong>
  </div>

  <div>
    <span>الباقة</span><br>
    <strong id="planName">—</strong>
  </div>
</div>

<div class="section">

  <div class="section-title">💌 الرسالة</div>

  <label>اسم الشخص اللي بتوصله الهدية</label>
  <input id="receiver" maxlength="40" placeholder="مثال: نور">

  <label>
    اسمك
    <span class="optional">— اختياري</span>
  </label>
  <input id="sender" maxlength="40" placeholder="تقدر تخليها مجهولة 👀">

  <label>وش ودك تقول له؟</label>
  <textarea id="message" maxlength="1200"
  placeholder="اكتب كلامك من قلبك..."></textarea>

  <div class="counter">
    <span id="count">0</span> / 1200
  </div>

</div>


<div class="section">

  <div class="section-title">🎨 اختر الجو</div>

  <div class="themes">

    <div class="theme romantic selected"
         onclick="chooseTheme(this,'romantic')">
      <b>Romantic ❤️</b>
    </div>

    <div class="theme midnight"
         onclick="chooseTheme(this,'midnight')">
      <b>Midnight 🌙</b>
    </div>

    <div class="theme sunset"
         onclick="chooseTheme(this,'sunset')">
      <b>Sunset ✨</b>
    </div>

    <div class="theme minimal"
         onclick="chooseTheme(this,'minimal')">
      <b>Minimal 🤍</b>
    </div>

  </div>

</div>


<div class="section">

  <div class="section-title">📸 ذكرياتكم</div>

  <label class="upload" for="photoInput">
    <div class="upload-icon">＋</div>
    <p>اضغط وأضف الصور</p>
    <small id="photoLimit">—</small>
  </label>

  <input
    id="photoInput"
    type="file"
    accept="image/*"
    multiple
  >

  <div class="photo-info" id="photoInfo"></div>

  <div class="previewImages" id="previewImages"></div>

</div>


<div class="section">

  <div class="section-title">🎵 أغنيتكم</div>

  <label>
    رابط الأغنية
    <span class="optional">— اختياري</span>
  </label>

  <input
    id="song"
    type="url"
    placeholder="YouTube / Spotify / Apple Music"
  >

</div>


<div class="section">

  <div class="section-title">⏳ تاريخ له معنى</div>

  <label>
    تاريخ بداية الذكرى
    <span class="optional">— اختياري</span>
  </label>

  <input id="date" type="date">

  <p style="color:#555;font-size:11px;line-height:1.7">
    إذا أضفته، نقدر نعرض في الهدية كم يوم مر على هاللحظة.
  </p>

</div>


<div class="actions">

  <button class="preview-btn" onclick="showPreview()">
    معاينة 👀
  </button>

  <button class="next" onclick="continueCheckout()">
    متابعة للدفع ←
  </button>

</div>

</main>
</div>


<div class="modal" id="modal">

<button class="close" onclick="closePreview()">×</button>

<div class="preview-card" id="previewCard">

  <div class="gift-heart">💌</div>

  <h2 id="previewTitle"></h2>

  <div class="preview-message" id="previewMessage"></div>

  <div class="preview-from" id="previewFrom"></div>

  <div class="preview-date" id="previewDate"></div>

  <div class="preview-gallery" id="previewGallery"></div>

</div>

</div>


<script>

const occasionNames = {
  love:"حب ❤️",
  birthday:"عيد ميلاد 🎂",
  friend:"صداقة 🫂",
  graduation:"تخرج 🎓",
  sorry:"اعتذار 🥹",
  surprise:"مفاجأة 🎁"
};

const planNames = {
  mini:"Mini",
  moment:"Moment",
  forever:"Forever"
};

const limits = {
  mini:5,
  moment:15,
  forever:30
};

let occasion =
  localStorage.getItem("lahzaOccasion") || "surprise";

let plan =
  localStorage.getItem("lahzaPlan") || "mini";

let theme =
  localStorage.getItem("lahzaTheme") || "romantic";

let selectedPhotos = [];

document.getElementById("occasionName").innerText =
  occasionNames[occasion] || "مفاجأة 🎁";

document.getElementById("planName").innerText =
  planNames[plan] || "Mini";

document.getElementById("photoLimit").innerText =
  "تقدر تضيف حتى " + limits[plan] + " صورة";


const message =
  document.getElementById("message");

message.addEventListener("input",function(){
  document.getElementById("count").innerText =
    message.value.length;
});


function chooseTheme(element,value){

  document.querySelectorAll(".theme").forEach(function(item){
    item.classList.remove("selected");
  });

  element.classList.add("selected");

  theme=value;

  localStorage.setItem("lahzaTheme",value);
}


document.getElementById("photoInput")
.addEventListener("change",function(e){

  const max = limits[plan];

  selectedPhotos =
    Array.from(e.target.files).slice(0,max);

  if(e.target.files.length > max){
    alert("باقتك تسمح بـ " + max + " صورة فقط");
  }

  document.getElementById("photoInfo").innerText =
    "تم اختيار " +
    selectedPhotos.length +
    " من " +
    max +
    " صورة";

  const container =
    document.getElementById("previewImages");

  container.innerHTML="";

  selectedPhotos.slice(0,8).forEach(function(file){

    const reader=new FileReader();

    reader.onload=function(event){

      const img=document.createElement("img");

      img.src=event.target.result;

      container.appendChild(img);
    };

    reader.readAsDataURL(file);

  });

});


function validateGift(){

  const receiver =
    document.getElementById("receiver").value.trim();

  const text =
    document.getElementById("message").value.trim();

  if(!receiver){

    alert("اكتب اسم الشخص اللي بتوصله الهدية 🤍");

    return false;
  }

  if(!text){

    alert("اكتب رسالتك أول 💌");

    return false;
  }

  return true;
}


function showPreview(){

  if(!validateGift()){
    return;
  }

  const receiver =
    document.getElementById("receiver").value.trim();

  const sender =
    document.getElementById("sender").value.trim();

  const text =
    document.getElementById("message").value.trim();

  const date =
    document.getElementById("date").value;


  document.getElementById("previewTitle").innerText =
    "إلى " + receiver + " 🤍";

  document.getElementById("previewMessage").innerText =
    text;

  document.getElementById("previewFrom").innerText =
    sender ? "من " + sender : "من شخص يفكر فيك ♡";


  if(date){

    document.getElementById("previewDate").innerText =
      "من " + date;

  }else{

    document.getElementById("previewDate").innerText="";
  }


  const gallery =
    document.getElementById("previewGallery");

  gallery.innerHTML="";


  selectedPhotos.slice(0,6).forEach(function(file){

    const reader=new FileReader();

    reader.onload=function(event){

      const img=document.createElement("img");

      img.src=event.target.result;

      gallery.appendChild(img);
    };

    reader.readAsDataURL(file);

  });


  const card =
    document.getElementById("previewCard");


  if(theme==="romantic"){

    card.style.background =
      "radial-gradient(circle at top,#38101f,#08080f 55%)";

  }

  if(theme==="midnight"){

    card.style.background =
      "radial-gradient(circle at top,#20265c,#08080f 60%)";

  }

  if(theme==="sunset"){

    card.style.background =
      "radial-gradient(circle at top,#71394d,#100a13 60%)";

  }

  if(theme==="minimal"){

    card.style.background =
      "linear-gradient(#1b1b1b,#080808)";

  }


  document.getElementById("modal")
    .classList.add("show");

  document.body.style.overflow="hidden";
}


function closePreview(){

  document.getElementById("modal")
    .classList.remove("show");

  document.body.style.overflow="";
}


function continueCheckout(){

  if(!validateGift()){
    return;
  }

  const giftData={

    receiver:
      document.getElementById("receiver").value.trim(),

    sender:
      document.getElementById("sender").value.trim(),

    message:
      document.getElementById("message").value.trim(),

    song:
      document.getElementById("song").value.trim(),

    date:
      document.getElementById("date").value,

    occasion:occasion,

    plan:plan,

    theme:theme

  };


  localStorage.setItem(
    "lahzaGift",
    JSON.stringify(giftData)
  );


 const p = new URLSearchParams();

p.set("receiver", giftData.receiver || "");
p.set("occasion", giftData.occasion || "");
p.set("message", giftData.message || "");
p.set("sender", giftData.sender || "");
p.set("date", giftData.date || "");
p.set("song", giftData.song || "");

window.location.href = "success.html?" + p.toString();
}

</script>

</body>
</html>
