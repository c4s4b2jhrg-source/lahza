<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#08080f">
<title>صمّم هديتك | LAHZA</title>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

body{
  margin:0;
  background:#08080f;
  color:white;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}

header{
  width:100%;
  max-width:760px;
  margin:auto;
  padding:20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{font-size:22px;font-weight:900}
.logo span{color:#ff4f87}

.back{
  color:#999;
  text-decoration:none;
  background:#15151e;
  padding:9px 14px;
  border-radius:100px;
  font-size:13px;
}

.progress{
  display:flex;
  justify-content:center;
  gap:7px;
  margin-bottom:20px;
}

.dot{
  width:7px;
  height:7px;
  background:#292933;
  border-radius:30px;
}

.dot.active{
  width:28px;
  background:#ff4f87;
}

main{
  width:100%;
  max-width:650px;
  margin:auto;
  padding:10px 18px 60px;
}

.title{text-align:center;margin-bottom:25px}
.title h1{font-size:32px;margin:0 0 8px}
.title p{color:#777;margin:0;line-height:1.7}

.summary{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-bottom:15px;
}

.summaryBox{
  background:#111118;
  border:1px solid #25252f;
  border-radius:16px;
  padding:14px;
}

.summaryBox span{color:#666;font-size:11px}

.summaryBox strong{
  display:block;
  color:#ff6596;
  margin-top:5px;
}

.section{
  background:#111118;
  border:1px solid #23232d;
  border-radius:22px;
  padding:20px;
  margin-bottom:15px;
}

.section-title{
  font-size:16px;
  font-weight:900;
  margin-bottom:15px;
}

label{
  display:block;
  color:#aaa;
  font-size:13px;
  margin:15px 2px 7px;
}

input,textarea{
  width:100%;
  border:1px solid #2a2a35;
  background:#0b0b11;
  color:white;
  padding:14px;
  border-radius:13px;
  outline:none;
  font:inherit;
}

input:focus,textarea:focus{border-color:#ff4f87}

textarea{
  min-height:140px;
  resize:vertical;
  line-height:1.8;
}

.optional{color:#555;font-size:11px}

.counter{
  color:#555;
  text-align:left;
  font-size:11px;
  margin-top:6px;
}

.themes{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}

.theme{
  height:95px;
  border-radius:16px;
  border:2px solid transparent;
  display:flex;
  align-items:flex-end;
  padding:12px;
  cursor:pointer;
  position:relative;
  overflow:hidden;
}

.theme.selected{border-color:white}

.theme.selected:after{
  content:"✓";
  position:absolute;
  top:8px;
  left:8px;
  width:24px;
  height:24px;
  border-radius:50%;
  background:white;
  color:#111;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
}

.romantic{background:linear-gradient(135deg,#3a0f20,#ff4f87)}
.midnight{background:linear-gradient(135deg,#090a20,#35407a)}
.sunset{background:linear-gradient(135deg,#60294a,#ff9864)}
.minimal{background:linear-gradient(135deg,#cfcfcf,#666)}

.upload{
  border:1px dashed #42424e;
  background:#0b0b11;
  border-radius:16px;
  padding:22px 15px;
  text-align:center;
  cursor:pointer;
}

.upload strong{
  display:block;
  margin-bottom:5px;
}

.upload small{color:#666}

.hidden{display:none}

.previewImages{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-top:12px;
}

.previewImages img{
  width:100%;
  aspect-ratio:1;
  object-fit:cover;
  border-radius:12px;
}

.fileInfo{
  color:#ff6697;
  font-size:12px;
  margin-top:10px;
}

.dateHelp{
  color:#666;
  font-size:11px;
  line-height:1.7;
  margin-top:8px;
}

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:20px;
}

.actions button{
  border:0;
  padding:16px 10px;
  border-radius:15px;
  font:inherit;
  font-weight:900;
  cursor:pointer;
}

.previewBtn{
  background:#1b1b24;
  color:white;
}

.nextBtn{
  background:linear-gradient(135deg,#ff3474,#ff6999);
  color:white;
}

/* المعاينة */

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:#08080f;
  z-index:100;
  overflow:auto;
}

.modal.show{display:block}

.close{
  position:fixed;
  top:18px;
  left:18px;
  width:42px;
  height:42px;
  border:0;
  border-radius:50%;
  background:#1e1e27;
  color:white;
  font-size:21px;
  cursor:pointer;
  z-index:120;
}

.previewWrap{
  width:min(92%,620px);
  margin:auto;
  min-height:100vh;
  padding:60px 0;
  text-align:center;
}

.previewLogo{
  font-size:26px;
  font-weight:900;
  margin-bottom:35px;
}

.previewLogo span{color:#ff4f87}

.previewReceiver{
  font-size:36px;
  margin-bottom:20px;
}

.previewCard{
  padding:30px 22px;
  border-radius:28px;
  background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.12);
  backdrop-filter:blur(15px);
}

.previewOccasion{
  display:inline-block;
  padding:8px 15px;
  border-radius:50px;
  background:rgba(255,79,135,.15);
  color:#ff75a3;
  margin-bottom:20px;
}

.previewMessage{
  font-size:22px;
  line-height:1.9;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  word-break:break-word;
  margin-bottom:20px;
}

.previewGallery{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px;
  margin-top:18px;
}

.previewGallery img{
  width:100%;
  height:auto;
  max-height:450px;
  object-fit:contain;
  border-radius:15px;
  background:rgba(0,0,0,.15);
}

.previewDate{
  color:#888;
  margin-top:20px;
  line-height:1.8;
}

.previewFrom{
  color:#aaa;
  margin-top:20px;
}

.previewFrom b{color:#ff6d9c}

.audioPreview{
  display:none;
  margin-top:22px;
}

.audioPreview audio{width:100%}

@media(max-width:480px){
  .title h1{font-size:29px}
  .section{padding:17px}
}
</style>
</head>

<body>

<header>
  <a href="plans.html" class="back">← رجوع</a>
  <div class="logo">LAHZA <span>♡</span></div>
</header>

<div class="progress">
  <div class="dot"></div>
  <div class="dot"></div>
  <div class="dot active"></div>
  <div class="dot"></div>
</div>

<main>

<div class="title">
  <h1>صمّم هديتك 🤍</h1>
  <p>خلك أنت صاحب اللحظة، وخله هو يعيشها.</p>
</div>

<div class="summary">

  <div class="summaryBox">
    <span>المناسبة</span>
    <strong id="occasionName">—</strong>
  </div>

  <div class="summaryBox">
    <span>الباقة</span>
    <strong id="planName">—</strong>
  </div>

</div>


<div class="section">

  <div class="section-title">💌 الرسالة</div>

  <label>اسم المستلم</label>
  <input id="receiver" maxlength="40" placeholder="مثال: نور">

  <label>
    اسمك
    <span class="optional">— اختياري</span>
  </label>

  <input
    id="sender"
    maxlength="40"
    placeholder="تقدر تخليها مجهولة"
  >

  <label>رسالتك</label>

  <textarea
    id="message"
    maxlength="1200"
    placeholder="اكتب كلامك من قلبك..."
  ></textarea>

  <div class="counter">
    <span id="count">0</span> / 1200
  </div>

</div>


<div class="section">

  <div class="section-title">🎨 اختر الثيم</div>

  <div class="themes">

    <div
      class="theme romantic selected"
      onclick="chooseTheme(this,'romantic')">
      <b>Romantic ❤️</b>
    </div>

    <div
      class="theme midnight"
      onclick="chooseTheme(this,'midnight')">
      <b>Midnight 🌙</b>
    </div>

    <div
      class="theme sunset"
      onclick="chooseTheme(this,'sunset')">
      <b>Sunset ✨</b>
    </div>

    <div
      class="theme minimal"
      onclick="chooseTheme(this,'minimal')">
      <b>Minimal 🤍</b>
    </div>

  </div>

</div>


<div class="section">

  <div class="section-title">📸 الصور</div>

  <label class="upload" for="photoInput">
    <strong>＋ أضف صورك</strong>
    <small id="photoLimit">—</small>
  </label>

  <input
    id="photoInput"
    class="hidden"
    type="file"
    accept="image/*"
    multiple
  >

  <div id="photoInfo" class="fileInfo"></div>

  <div id="previewImages" class="previewImages"></div>

</div>


<div class="section">

  <div class="section-title">🎵 الأغنية</div>

  <label class="upload" for="audioInput">
    <strong>＋ ارفع الأغنية</strong>
    <small>MP3 / M4A / WAV</small>
  </label>

  <input
    id="audioInput"
    class="hidden"
    type="file"
    accept="audio/*"
  >

  <div id="audioInfo" class="fileInfo"></div>

</div>


<div class="section">

  <div class="section-title">⏳ تاريخ له معنى</div>

  <label>
    تاريخ الذكرى
    <span class="optional">— اختياري</span>
  </label>

  <input id="date" type="date">

  <div class="dateHelp">
    أول لقاء، عيد ميلاد، ذكرى، أو أي يوم له معنى 🤍
    <br>
    لا يمكن اختيار تاريخ بعد اليوم.
  </div>

</div>


<div class="actions">

  <button
    class="previewBtn"
    onclick="showPreview()">
    معاينة 👀
  </button>

  <button
    class="nextBtn"
    onclick="continueNext()">
    متابعة للدفع ←
  </button>

</div>

</main>


<!-- المعاينة -->

<div class="modal" id="modal">

  <button
    class="close"
    onclick="closePreview()">
    ×
  </button>

  <div
    class="previewWrap"
    id="previewWrap">

    <div class="previewLogo">
      LAHZA <span>♡</span>
    </div>

    <div
      class="previewReceiver"
      id="previewReceiver">
    </div>

    <div class="previewCard">

      <div
        class="previewOccasion"
        id="previewOccasion">
      </div>

      <div
        class="previewMessage"
        id="previewMessage">
      </div>

      <div
        class="previewGallery"
        id="previewGallery">
      </div>

      <div
        class="previewDate"
        id="previewDate">
      </div>

      <div
        class="previewFrom"
        id="previewFrom">
      </div>

      <div
        class="audioPreview"
        id="audioPreview">

        <audio
          id="previewAudio"
          controls>
        </audio>

      </div>

    </div>

  </div>

</div>


<script>

/* المناسبة والباقات */

const occasionNames = {
  love:"حب ❤️",
  birthday:"عيد ميلاد 🎂",
  friend:"صداقة 🫂",
  graduation:"تخرج 🎓",
  sorry:"اعتذار 🥹",
  surprise:"مفاجأة 🎁"
};

const planNames = {
  mini:"Mini",
  moment:"Moment",
  forever:"Forever"
};

const limits = {
  mini:5,
  moment:15,
  forever:30
};


/* البيانات المحفوظة */

let occasion =
  localStorage.getItem("lahzaOccasion") || "surprise";

let plan =
  localStorage.getItem("lahzaPlan") || "mini";

let theme =
  localStorage.getItem("lahzaTheme") || "romantic";

let selectedPhotos = [];

let selectedAudio = null;

let selectedAudioURL = "";


/* عرض المناسبة والباقة */

document.getElementById("occasionName").textContent =
  occasionNames[occasion] || "مفاجأة 🎁";

document.getElementById("planName").textContent =
  planNames[plan] || "Mini";

document.getElementById("photoLimit").textContent =
  "حتى " + limits[plan] + " صورة";


/* منع التاريخ المستقبلي */

const dateInput =
  document.getElementById("date");

function setMaximumDate(){

  const now = new Date();

  const year =
    now.getFullYear();

  const month =
    String(now.getMonth() + 1).padStart(2,"0");

  const day =
    String(now.getDate()).padStart(2,"0");

  const today =
    year + "-" + month + "-" + day;

  dateInput.max = today;
}

setMaximumDate();


/* حماية إضافية للتاريخ */

dateInput.addEventListener("change",function(){

  if(!dateInput.value){
    return;
  }

  if(dateInput.value > dateInput.max){

    alert("ما تقدر تختار تاريخ بعد اليوم 🤍");

    dateInput.value = "";
  }

});


/* عداد الرسالة */

const messageBox =
  document.getElementById("message");

messageBox.addEventListener("input",function(){

  document.getElementById("count").textContent =
    messageBox.value.length;

});


/* الثيم */

function chooseTheme(element,value){

  document.querySelectorAll(".theme")
  .forEach(function(item){

    item.classList.remove("selected");

  });

  element.classList.add("selected");

  theme = value;

  localStorage.setItem(
    "lahzaTheme",
    value
  );

}


/* الصور */

document.getElementById("photoInput")
.addEventListener("change",function(event){

  const max =
    limits[plan];

  selectedPhotos =
    Array.from(event.target.files)
    .slice(0,max);

  if(event.target.files.length > max){

    alert(
      "باقتك تسمح بـ " +
      max +
      " صورة"
    );

  }

  document.getElementById("photoInfo").textContent =
    "تم اختيار " +
    selectedPhotos.length +
    " صورة";

  const preview =
    document.getElementById("previewImages");

  preview.innerHTML = "";

  selectedPhotos
  .slice(0,9)
  .forEach(function(file){

    const reader =
      new FileReader();

    reader.onload =
    function(event){

      const img =
        document.createElement("img");

      img.src =
        event.target.result;

      preview.appendChild(img);

    };

    reader.readAsDataURL(file);

  });

});


/* الأغنية */

document.getElementById("audioInput")
.addEventListener("change",function(event){

  selectedAudio =
    event.target.files[0] || null;

  if(!selectedAudio){
    return;
  }

  if(selectedAudioURL){

    URL.revokeObjectURL(
      selectedAudioURL
    );

  }

  selectedAudioURL =
    URL.createObjectURL(
      selectedAudio
    );

  document.getElementById("audioInfo").textContent =
    "🎵 " + selectedAudio.name;

});


/* التحقق */

function validate(){

  const receiver =
    document.getElementById("receiver")
    .value.trim();

  const message =
    document.getElementById("message")
    .value.trim();

  if(!receiver){

    alert(
      "اكتب اسم المستلم 🤍"
    );

    return false;
  }

  if(!message){

    alert(
      "اكتب الرسالة 💌"
    );

    return false;
  }


  /* تحقق التاريخ مرة ثانية */

  if(
    dateInput.value &&
    dateInput.value > dateInput.max
  ){

    alert(
      "تاريخ الذكرى ما يقدر يكون بالمستقبل 🤍"
    );

    dateInput.value = "";

    return false;
  }

  return true;
}


/* تحويل التاريخ لشكل عربي */

function formatArabicDate(value){

  if(!value){
    return "";
  }

  const parts =
    value.split("-");

  const year =
    Number(parts[0]);

  const month =
    Number(parts[1]);

  const day =
    Number(parts[2]);

  const months = [
    "يناير",
    "فبراير",
    "مارس",
    "أبريل",
    "مايو",
    "يونيو",
    "يوليو",
    "أغسطس",
    "سبتمبر",
    "أكتوبر",
    "نوفمبر",
    "ديسمبر"
  ];

  return (
    day +
    " " +
    months[month - 1] +
    " " +
    year
  );
}


/* المعاينة */

function showPreview(){

  if(!validate()){
    return;
  }

  const receiver =
    document.getElementById("receiver")
    .value.trim();

  const sender =
    document.getElementById("sender")
    .value.trim();

  const message =
    document.getElementById("message")
    .value.trim();

  const date =
    dateInput.value;


  document.getElementById("previewReceiver").textContent =
    "إلى " +
    receiver +
    " ♡";


  document.getElementById("previewOccasion").textContent =
    occasionNames[occasion] ||
    "لحظة خاصة";


  document.getElementById("previewMessage").textContent =
    message;


  document.getElementById("previewFrom").innerHTML =
    "من ♡ <b>" +
    (sender || "شخص يفكر فيك") +
    "</b>";


  document.getElementById("previewDate").textContent =
    date
    ? "🤍 " + formatArabicDate(date)
    : "";


  /* صور المعاينة */

  const gallery =
    document.getElementById("previewGallery");

  gallery.innerHTML = "";

  selectedPhotos
  .slice(0,6)
  .forEach(function(file){

    const reader =
      new FileReader();

    reader.onload =
    function(event){

      const img =
        document.createElement("img");

      img.src =
        event.target.result;

      gallery.appendChild(img);

    };

    reader.readAsDataURL(file);

  });


  /* أغنية المعاينة */

  const audioPreview =
    document.getElementById("audioPreview");

  if(selectedAudioURL){

    document.getElementById("previewAudio").src =
      selectedAudioURL;

    audioPreview.style.display =
      "block";

  }else{

    audioPreview.style.display =
      "none";

  }


  /* تطبيق الثيم */

  const wrap =
    document.getElementById("previewWrap");

  if(theme === "romantic"){

    wrap.style.background =
      "radial-gradient(circle at top,#35101f,#08080f 60%)";

  }

  if(theme === "midnight"){

    wrap.style.background =
      "radial-gradient(circle at top,#20295f,#08080f 60%)";

  }

  if(theme === "sunset"){

    wrap.style.background =
      "radial-gradient(circle at top,#713a4e,#100a13 60%)";

  }

  if(theme === "minimal"){

    wrap.style.background =
      "linear-gradient(#1a1a1a,#080808)";

  }


  document.getElementById("modal")
  .classList.add("show");

  document.body.style.overflow =
    "hidden";

}


/* إغلاق المعاينة */

function closePreview(){

  document.getElementById("modal")
  .classList.remove("show");

  document.body.style.overflow =
    "";

}


/* متابعة */

function continueNext(){

  if(!validate()){
    return;
  }

  const giftData = {

    receiver:
      document.getElementById("receiver")
      .value.trim(),

    sender:
      document.getElementById("sender")
      .value.trim(),

    message:
      document.getElementById("message")
      .value.trim(),

    date:
      dateInput.value,

    occasion:occasion,

    plan:plan,

    theme:theme

  };


  localStorage.setItem(
    "lahzaGift",
    JSON.stringify(giftData)
  );


  window.location.href =
    "checkout.html";

}

</script>

</body>
</html>
