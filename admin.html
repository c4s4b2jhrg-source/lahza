<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0d0a0f">
  <title>لوحة الإدارة | LAHZA</title>
  <style>
    :root{
      --bg:#0d0a0f;--card:#171219;--card2:#1d171f;--line:#382c3c;
      --text:#fff8fb;--muted:#b7aab4;--pink:#f58aae;--pink2:#ffb7cd;
      --green:#31d17c;--yellow:#f3c969;--red:#ff6b7d;--shadow:0 20px 65px rgba(0,0,0,.32)
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:
      radial-gradient(circle at 50% -10%,rgba(245,138,174,.12),transparent 35%),
      linear-gradient(180deg,#100c12,#0a080c 72%);color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif}
    button,input{font:inherit}
    button{cursor:pointer}
    .wrap{width:min(1180px,100%);margin:auto;padding:18px 14px 48px}
    .top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
    .brand{font-size:20px;font-weight:950;letter-spacing:1.4px}
    .ghost{border:1px solid var(--line);background:#211a23;color:var(--text);border-radius:13px;padding:10px 13px}
    .login{
      width:min(440px,100%);margin:9vh auto 0;background:rgba(23,18,25,.92);
      border:1px solid var(--line);border-radius:26px;padding:24px;box-shadow:var(--shadow)
    }
    h1{margin:0 0 8px;font-size:28px}
    .muted{color:var(--muted);line-height:1.7}
    .field{margin-top:14px}
    .field label{display:block;color:var(--muted);font-size:13px;margin-bottom:7px}
    .input{
      width:100%;border:1px solid var(--line);background:#0f0c11;color:var(--text);
      border-radius:15px;padding:13px 14px;outline:0
    }
    .input:focus{border-color:rgba(245,138,174,.65)}
    .primary{
      width:100%;margin-top:16px;border:0;border-radius:15px;padding:14px 16px;
      background:linear-gradient(135deg,var(--pink),#ff739f);color:#2a1019;font-weight:950
    }
    #app{display:none}
    .stats{display:grid;grid-template-columns:repeat(5,1fr);gap:11px;margin:15px 0}
    .stat{background:rgba(23,18,25,.9);border:1px solid var(--line);border-radius:19px;padding:15px}
    .stat b{display:block;font-size:25px;margin-top:5px}
    .stat span{font-size:12px;color:var(--muted)}
    .toolbar{
      display:grid;grid-template-columns:1fr auto;gap:10px;margin:15px 0
    }
    .filters{display:flex;gap:7px;flex-wrap:wrap}
    .filter{
      border:1px solid var(--line);background:#1c161e;color:var(--muted);
      padding:10px 13px;border-radius:999px;font-weight:800
    }
    .filter.active{background:rgba(245,138,174,.13);border-color:rgba(245,138,174,.45);color:#ffd8e5}
    .bulkbar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin:10px 0 14px;padding:11px 12px;background:rgba(23,18,25,.9);border:1px solid var(--line);border-radius:17px}
    .bulkbar .spacer{flex:1}
    .bulkcheck{width:19px;height:19px;accent-color:var(--pink)}
    .bulkdelete{border:1px solid rgba(255,107,125,.3);background:rgba(255,107,125,.09);color:#ff9aa7;border-radius:12px;padding:9px 12px;font-weight:900}
    .bulkdelete:disabled{opacity:.4;cursor:not-allowed}
    .orders{display:grid;gap:12px}
    .order{
      background:rgba(23,18,25,.92);border:1px solid var(--line);border-radius:22px;
      padding:17px;box-shadow:0 10px 35px rgba(0,0,0,.18)
    }
    .orderHead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
    .orderNo{font-size:13px;color:var(--muted);direction:ltr;text-align:right}
    .receiver{font-size:20px;font-weight:950;margin-top:3px}
    .badge{display:inline-flex;border-radius:999px;padding:7px 10px;font-size:12px;font-weight:900;white-space:nowrap}
    .pending{background:rgba(243,201,105,.12);color:#f6d887;border:1px solid rgba(243,201,105,.25)}
    .paid{background:rgba(49,209,124,.11);color:#89efb8;border:1px solid rgba(49,209,124,.24)}
    .meta{display:flex;gap:8px;flex-wrap:wrap;margin:13px 0}
    .chip{background:#211a23;border:1px solid #302635;color:#d6cbd3;border-radius:999px;padding:7px 10px;font-size:12px}
    .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}
    .btn{border:1px solid var(--line);background:#231b26;color:var(--text);border-radius:13px;padding:10px 12px;font-weight:850}
    .btn.confirm{background:rgba(49,209,124,.11);border-color:rgba(49,209,124,.28);color:#8df0ba}
    .btn.archive{background:rgba(117,167,255,.08);border-color:rgba(117,167,255,.25);color:#a9c8ff}
    .btn.restore{background:rgba(49,209,124,.08);border-color:rgba(49,209,124,.25);color:#8df0ba}
    .btn.danger{background:rgba(255,107,125,.08);border-color:rgba(255,107,125,.28);color:#ff9aa7;margin-inline-start:auto}
    .details{display:none;margin-top:14px;padding-top:13px;border-top:1px solid rgba(255,255,255,.07)}
    .details.open{display:block}
    .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
    .detail{background:#100d12;border-radius:14px;padding:11px}
    .detail span{display:block;font-size:11px;color:var(--muted);margin-bottom:4px}
    .detail b{font-size:13px;word-break:break-word}
    .message{margin-top:9px;background:#100d12;border-radius:14px;padding:12px;line-height:1.8;white-space:pre-wrap}
    .empty{text-align:center;padding:42px 14px;color:var(--muted)}
    .loading{text-align:center;padding:35px;color:var(--muted)}
    .toast{
      position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(20px);
      background:#211a23;border:1px solid var(--line);padding:11px 15px;border-radius:14px;
      opacity:0;pointer-events:none;transition:.2s;z-index:20;box-shadow:var(--shadow)
    }
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
    @media(max-width:760px){
      .stats{grid-template-columns:repeat(2,1fr)}
      .toolbar{grid-template-columns:1fr}
      .grid{grid-template-columns:1fr}
      .btn.danger{margin-inline-start:0}
    }
  </style>
</head>
<body>
<div class="wrap">
  <div id="login" class="login">
    <div class="brand">LAHZA ♡</div>
    <h1 style="margin-top:18px">لوحة الإدارة</h1>
    <div class="muted">سجّل دخولك بحساب الأدمن.</div>
    <div class="field"><label>الإيميل</label><input id="email" class="input" type="email" autocomplete="username"></div>
    <div class="field"><label>كلمة المرور</label><input id="password" class="input" type="password" autocomplete="current-password"></div>
    <button id="loginBtn" class="primary">دخول</button>
    <div id="loginError" class="muted" style="margin-top:12px;color:#ff9aa7"></div>
  </div>

  <div id="app">
    <div class="top">
      <div>
        <div class="brand">LAHZA ♡</div>
        <div class="muted" style="font-size:12px;margin-top:3px">إدارة الطلبات</div>
      </div>
      <button class="ghost" id="logoutBtn">تسجيل خروج</button>
    </div>

    <section class="stats">
      <div class="stat"><span>الطلبات النشطة</span><b id="statAll">0</b></div>
      <div class="stat"><span>بانتظار الدفع</span><b id="statPending">0</b></div>
      <div class="stat"><span>مدفوعة</span><b id="statPaid">0</b></div>
      <div class="stat"><span>المؤرشفة</span><b id="statArchived">0</b></div>
      <div class="stat"><span>إجمالي المبيعات</span><b id="statSales">0.000</b><span>د.ب</span></div>
    </section>

    <section class="toolbar">
      <input id="search" class="input" placeholder="ابحث برقم الطلب أو اسم المستلم...">
      <div class="filters">
        <button class="filter active" data-filter="all">الكل</button>
        <button class="filter" data-filter="pending">بانتظار الدفع</button>
        <button class="filter" data-filter="paid">مدفوع</button>
        <button class="filter" data-filter="archived">المؤرشفة</button>
      </div>
    </section>

    <div class="bulkbar">
      <input id="selectAll" class="bulkcheck" type="checkbox">
      <label for="selectAll" style="font-weight:850">تحديد الظاهر</label>
      <span id="selectedCount" class="muted" style="font-size:12px">0 محدد</span>
      <span class="spacer"></span>
      <button id="archiveSelected" class="btn archive" disabled>📦 أرشفة المحدد</button>
      <button id="deleteSelected" class="bulkdelete" disabled>🗑 حذف نهائي</button>
    </div>
    <div id="orders" class="orders"><div class="loading">جاري تحميل الطلبات...</div></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://ltuyfewachzbazunuxmd.supabase.co";
const SUPABASE_KEY="sb_publishable_UL-3si425vxRnBAGcgtDJA_Xw5VB3yN";
const ADMIN_EMAIL="adelhussain66@gmail.com";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

let orders=[];
let currentFilter="all";
let selected=new Set();

const $=s=>document.querySelector(s);
const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]));
const money=v=>(Number(v)||0).toFixed(3);
const fmtDate=v=>{
  if(!v)return "—";
  try{return new Intl.DateTimeFormat("ar-BH",{dateStyle:"medium",timeStyle:"short"}).format(new Date(v))}catch{return v}
};

function toast(msg){
  const t=$("#toast");t.textContent=msg;t.classList.add("show");
  clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove("show"),1800);
}

function giftUrl(token){
  const dir=location.pathname.replace(/admin\.html.*$/i,"");
  return location.origin+dir+"gift.html?token="+encodeURIComponent(token);
}

async function checkSession(){
  const {data}=await sb.auth.getSession();
  const user=data?.session?.user;
  if(user?.email?.toLowerCase()===ADMIN_EMAIL.toLowerCase()){
    showApp();loadOrders();
  }else{
    $("#login").style.display="block";
    $("#app").style.display="none";
  }
}

async function login(){
  $("#loginError").textContent="";
  $("#loginBtn").disabled=true;
  const email=$("#email").value.trim(),password=$("#password").value;
  if(email.toLowerCase()!==ADMIN_EMAIL.toLowerCase()){
    $("#loginError").textContent="هذا الحساب غير مصرح له.";
    $("#loginBtn").disabled=false;return;
  }
  const {data,error}=await sb.auth.signInWithPassword({email,password});
  $("#loginBtn").disabled=false;
  if(error){$("#loginError").textContent=error.message;return}
  if(data.user?.email?.toLowerCase()!==ADMIN_EMAIL.toLowerCase()){
    await sb.auth.signOut();$("#loginError").textContent="هذا الحساب غير مصرح له.";return;
  }
  showApp();loadOrders();
}
function showApp(){$("#login").style.display="none";$("#app").style.display="block"}

async function loadOrders(){
  $("#orders").innerHTML='<div class="loading">جاري تحميل الطلبات...</div>';
  const {data,error}=await sb.from("orders").select("*").order("created_at",{ascending:false});
  if(error){
    $("#orders").innerHTML='<div class="empty">تعذر تحميل الطلبات: '+esc(error.message)+'</div>';return;
  }
  orders=data||[];render();
}

function render(){
  const q=$("#search").value.trim().toLowerCase();
  const filtered=orders.filter(o=>{
    const status=(o.status||"pending").toLowerCase();
    const archived=!!o.archived;
    if(currentFilter==="archived" && !archived)return false;
    if(currentFilter==="all" && archived)return false;
    if(currentFilter==="pending" && (archived || status!=="pending"))return false;
    if(currentFilter==="paid" && (archived || status!=="paid"))return false;
    if(!q)return true;
    return String(o.order_number||"").toLowerCase().includes(q) ||
           String(o.receiver||"").toLowerCase().includes(q) ||
           String(o.sender||"").toLowerCase().includes(q);
  });

  const active=orders.filter(o=>!o.archived);
  $("#statAll").textContent=active.length;
  $("#statPending").textContent=active.filter(o=>(o.status||"pending")==="pending").length;
  $("#statPaid").textContent=active.filter(o=>o.status==="paid").length;
  $("#statArchived").textContent=orders.filter(o=>!!o.archived).length;
  $("#statSales").textContent=money(orders.filter(o=>o.status==="paid").reduce((s,o)=>s+(Number(o.price)||0),0));

  if(!filtered.length){$("#orders").innerHTML='<div class="empty">ما في طلبات تطابق البحث.</div>';return}

  $("#orders").innerHTML=filtered.map(o=>{
    const paid=o.status==="paid";
    const archived=!!o.archived;
    const photos=Array.isArray(o.photos)?o.photos.length:0;
    const media=[
      photos?`${photos} صور`:"",
      o.voice_url?"فويس":"",
      o.video_url?"فيديو":"",
      o.audio_url?"موسيقى":"",
      o.open_at?"موعد فتح":"",
      o.gift_pin?"PIN":""
    ].filter(Boolean);

    return `<article class="order" id="order-${esc(o.id)}">
      <div class="orderHead">
        <div style="display:flex;gap:10px;align-items:flex-start">
          <input class="bulkcheck orderSelect" type="checkbox" data-id="${esc(o.id)}" ${selected.has(o.id)?"checked":""} onchange="toggleSelect('${esc(o.id)}',this.checked)">
          <div>
          <div class="orderNo">${esc(o.order_number||o.id)}</div>
          <div class="receiver">${esc(o.receiver||"بدون اسم")}</div>
          </div>
        </div>
        <span class="badge ${paid?"paid":"pending"}">${archived?"مؤرشف":(paid?"مدفوع ✓":"بانتظار الدفع")}</span>
      </div>

      <div class="meta">
        <span class="chip">${esc((o.plan||"—").toUpperCase())}</span>
        <span class="chip">${money(o.price)} د.ب</span>
        <span class="chip">${esc(o.occasion||"بدون مناسبة")}</span>
        <span class="chip">${fmtDate(o.created_at)}</span>
        ${media.map(x=>`<span class="chip">${esc(x)}</span>`).join("")}
      </div>

      <div class="actions">
        ${(!paid && !archived)?`<button class="btn confirm" onclick="confirmPayment('${esc(o.id)}')">تأكيد الدفع</button>`:""}
        ${paid?`<button class="btn" onclick="copyGift('${esc(o.gift_token||"")}')">نسخ رابط الهدية</button>
        <button class="btn" onclick="openGift('${esc(o.gift_token||"")}')">فتح الهدية</button>`:""}
        <button class="btn" onclick="toggleDetails('${esc(o.id)}')">تفاصيل</button>
        ${archived
          ? `<button class="btn restore" onclick="restoreOrder('${esc(o.id)}')">↩ استرجاع</button>`
          : `<button class="btn archive" onclick="archiveOrder('${esc(o.id)}')">📦 أرشفة</button>`}
        <button class="btn danger" onclick="deleteOrder('${esc(o.id)}')">🗑 حذف نهائي</button>
      </div>

      <div class="details" id="details-${esc(o.id)}">
        <div class="grid">
          <div class="detail"><span>المرسل</span><b>${esc(o.sender_anonymous?"مجهول":(o.sender||"—"))}</b></div>
          <div class="detail"><span>التاريخ المختار</span><b>${esc(o.gift_date||"—")}</b></div>
          <div class="detail"><span>الثيم</span><b>${esc(o.theme||"—")}</b></div>
          <div class="detail"><span>وقت تأكيد الدفع</span><b>${fmtDate(o.paid_at)}</b></div>
          <div class="detail"><span>وقت الفتح</span><b>${fmtDate(o.open_at)}</b></div>
          <div class="detail"><span>التوكن</span><b style="direction:ltr;text-align:right">${esc(o.gift_token||"—")}</b></div>
        </div>
        ${o.message?`<div class="message"><b style="display:block;margin-bottom:5px">الرسالة</b>${esc(o.message)}</div>`:""}
      </div>
    </article>`;
  }).join("");
  updateBulkUI();
}

function visibleOrderIds(){
  const q=$("#search").value.trim().toLowerCase();
  return orders.filter(o=>{
    const status=(o.status||"pending").toLowerCase();
    const archived=!!o.archived;
    if(currentFilter==="archived" && !archived)return false;
    if(currentFilter==="all" && archived)return false;
    if(currentFilter==="pending" && (archived || status!=="pending"))return false;
    if(currentFilter==="paid" && (archived || status!=="paid"))return false;
    if(!q)return true;
    return String(o.order_number||"").toLowerCase().includes(q) ||
           String(o.receiver||"").toLowerCase().includes(q) ||
           String(o.sender||"").toLowerCase().includes(q);
  }).map(o=>o.id);
}

function toggleSelect(id,checked){
  if(checked)selected.add(id); else selected.delete(id);
  updateBulkUI();
}

function updateBulkUI(){
  const ids=visibleOrderIds();
  const selectedVisible=ids.filter(id=>selected.has(id)).length;
  $("#selectedCount").textContent=selected.size+" محدد";
  $("#deleteSelected").disabled=selected.size===0;
  $("#archiveSelected").disabled=selected.size===0;
  $("#selectAll").checked=ids.length>0 && selectedVisible===ids.length;
  $("#selectAll").indeterminate=selectedVisible>0 && selectedVisible<ids.length;
}


async function archiveOrder(id){
  const o=orders.find(x=>x.id===id);if(!o)return;
  if(!confirm(`أرشفة الطلب ${o.order_number||""}؟\n\nرابط الهدية بيظل شغال وما راح تنحذف الملفات.`))return;
  const now=new Date().toISOString();
  const {error}=await sb.from("orders").update({archived:true,archived_at:now}).eq("id",id);
  if(error){
    alert("تعذر أرشفة الطلب: "+error.message+"\n\nإذا ظهر أن العمود غير موجود، شغّل كود SQL الخاص بالأرشفة.");
    return;
  }
  o.archived=true;o.archived_at=now;selected.delete(id);render();toast("تمت أرشفة الطلب");
}

async function restoreOrder(id){
  const o=orders.find(x=>x.id===id);if(!o)return;
  const {error}=await sb.from("orders").update({archived:false,archived_at:null}).eq("id",id);
  if(error){alert("تعذر استرجاع الطلب: "+error.message);return}
  o.archived=false;o.archived_at=null;selected.delete(id);render();toast("تم استرجاع الطلب");
}

async function archiveSelectedOrders(){
  const ids=[...selected];
  if(!ids.length)return;
  if(!confirm(`أرشفة ${ids.length} طلب؟\n\nروابط الهدايا بتظل شغالة.`))return;
  $("#archiveSelected").disabled=true;
  $("#archiveSelected").textContent="جاري الأرشفة...";
  const now=new Date().toISOString();
  const {error}=await sb.from("orders").update({archived:true,archived_at:now}).in("id",ids);
  $("#archiveSelected").textContent="📦 أرشفة المحدد";
  if(error){
    $("#archiveSelected").disabled=false;
    alert("تعذر أرشفة الطلبات: "+error.message);
    return;
  }
  orders.forEach(o=>{if(selected.has(o.id)){o.archived=true;o.archived_at=now}});
  selected.clear();render();toast(`تمت أرشفة ${ids.length} طلب`);
}

async function deleteSelectedOrders(){
  const ids=[...selected];
  if(!ids.length)return;
  const chosen=orders.filter(o=>selected.has(o.id));
  const paidCount=chosen.filter(o=>o.status==="paid").length;
  let msg=`⚠️ حذف نهائي\n\nمتأكد تبي تحذف ${ids.length} طلب؟\nروابط الهدايا لهالطلبات بتتوقف.\n\nإذا بس تبي تخفيهم استخدم "أرشفة المحدد".`;
  if(paidCount)msg+=`\nمن بينهم ${paidCount} طلب مدفوع.`;
  if(!confirm(msg))return;

  $("#deleteSelected").disabled=true;
  $("#deleteSelected").textContent="جاري الحذف...";

  // Best-effort cleanup of media first.
  for(const o of chosen){
    const paths=extractStoragePaths(o);
    if(paths.length){
      try{
        const {error}=await sb.storage.from("gift-media").remove(paths);
        if(error)console.warn("storage cleanup",o.id,error.message);
      }catch(e){console.warn("storage cleanup",o.id,e)}
    }
  }

  const {error}=await sb.from("orders").delete().in("id",ids);
  $("#deleteSelected").textContent="🗑 حذف المحدد";
  if(error){
    $("#deleteSelected").disabled=false;
    alert("تعذر حذف الطلبات: "+error.message);
    return;
  }

  orders=orders.filter(o=>!selected.has(o.id));
  selected.clear();
  render();
  toast(`تم حذف ${ids.length} طلب`);
}

function toggleDetails(id){
  document.getElementById("details-"+id)?.classList.toggle("open");
}

async function confirmPayment(id){
  const o=orders.find(x=>x.id===id);if(!o)return;
  if(!confirm(`تأكيد استلام مبلغ طلب ${o.order_number||""}؟`))return;
  const {error}=await sb.from("orders").update({status:"paid",paid_at:new Date().toISOString()}).eq("id",id);
  if(error){alert("تعذر تأكيد الدفع: "+error.message);return}
  o.status="paid";o.paid_at=new Date().toISOString();render();toast("تم تأكيد الدفع ✓");
}

async function copyGift(token){
  if(!token)return alert("هذا الطلب ما عنده رابط هدية.");
  const url=giftUrl(token);
  try{await navigator.clipboard.writeText(url);toast("تم نسخ رابط الهدية")}catch{prompt("انسخ الرابط:",url)}
}

function openGift(token){
  if(!token)return alert("هذا الطلب ما عنده رابط هدية.");
  window.open(giftUrl(token),"_blank","noopener,noreferrer");
}

function extractStoragePaths(o){
  const paths=[];
  const add=(v)=>{
    if(!v||typeof v!=="string")return;
    let p=v.trim();
    if(/^https?:\/\//i.test(p)){
      try{
        const u=new URL(p),mark="/gift-media/";
        const i=u.pathname.indexOf(mark);
        if(i>=0)p=decodeURIComponent(u.pathname.slice(i+mark.length)); else return;
      }catch{return}
    }
    p=p.replace(/^storage-(?:audio|video):/,"").replace(/^\/+/,"").replace(/^gift-media\//,"");
    if(p)paths.push(p);
  };
  if(Array.isArray(o.photos))o.photos.forEach(x=>add(typeof x==="string"?x:(x?.path||x?.url||"")));
  add(o.audio_url);
  add(o.voice_url);
  add(o.video_url);
  add(o.featured_photo);
  return [...new Set(paths)];
}

async function deleteOrder(id){
  const o=orders.find(x=>x.id===id);if(!o)return;
  const label=o.order_number||id;
  const paid=o.status==="paid";

  const ok=confirm(
    paid
      ? `هذا الطلب مدفوع.\n\nمتأكد تبي تحذف الطلب ${label} نهائيًا؟`
      : `متأكد تبي تحذف الطلب ${label}؟\n\nالحذف نهائي.`
  );
  if(!ok)return;

  // Best-effort media cleanup. If storage policy blocks deletion, order deletion still proceeds.
  const paths=extractStoragePaths(o);
  if(paths.length){
    try{
      const {error:storageError}=await sb.storage.from("gift-media").remove(paths);
      if(storageError)console.warn("تعذر حذف بعض ملفات الهدية:",storageError.message);
    }catch(e){console.warn("storage cleanup",e)}
  }

  const {error}=await sb.from("orders").delete().eq("id",id);
  if(error){
    alert("تعذر حذف الطلب: "+error.message);
    return;
  }

  orders=orders.filter(x=>x.id!==id);
  selected.delete(id);
  render();
  toast("تم حذف الطلب");
}
