<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0a0f">

<title>لوحة الإدارة | LAHZA</title>

<style>
:root{
  --bg:#0d0a0f;
  --card:#171219;
  --line:#382c3c;
  --text:#fff8fb;
  --muted:#b7aab4;
  --pink:#f58aae;
  --green:#31d17c;
  --yellow:#f3c969;
  --red:#ff6b7d;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  background:
    radial-gradient(circle at 50% -10%,rgba(245,138,174,.12),transparent 35%),
    linear-gradient(180deg,#100c12,#0a080c 72%);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif;
}

button,input{
  font:inherit;
}

button{
  cursor:pointer;
}

.wrap{
  width:min(1180px,100%);
  margin:auto;
  padding:18px 14px 50px;
}

.brand{
  font-size:21px;
  font-weight:950;
  letter-spacing:1.5px;
}

.muted{
  color:var(--muted);
}

.login{
  width:min(440px,100%);
  margin:9vh auto 0;
  padding:25px;
  border-radius:25px;
  background:rgba(23,18,25,.94);
  border:1px solid var(--line);
}

.login h1{
  margin:20px 0 7px;
}

.field{
  margin-top:15px;
}

.field label{
  display:block;
  font-size:13px;
  color:var(--muted);
  margin-bottom:7px;
}

.input{
  width:100%;
  padding:13px 14px;
  border-radius:14px;
  border:1px solid var(--line);
  outline:none;
  background:#0f0c11;
  color:white;
}

.input:focus{
  border-color:rgba(245,138,174,.65);
}

.primary{
  width:100%;
  margin-top:17px;
  padding:14px;
  border:0;
  border-radius:15px;
  background:linear-gradient(135deg,#f58aae,#ff739f);
  color:#2a1019;
  font-weight:950;
}

#app{
  display:none;
}

.top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:16px;
}

.ghost{
  padding:10px 13px;
  border-radius:13px;
  border:1px solid var(--line);
  background:#211a23;
  color:white;
}

/* الإحصائيات */

.stats{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:10px;
  margin:15px 0;
}

.stat{
  min-height:100px;
  padding:15px;
  border-radius:19px;
  background:rgba(23,18,25,.92);
  border:1px solid var(--line);
}

.stat span{
  color:var(--muted);
  font-size:12px;
}

.stat b{
  display:block;
  margin-top:7px;
  font-size:25px;
  direction:ltr;
}

.onlineStat{
  position:relative;
  overflow:hidden;
}

.liveDot{
  display:inline-block;
  width:7px;
  height:7px;
  border-radius:50%;
  background:var(--green);
  margin-left:5px;
  box-shadow:0 0 0 4px rgba(49,209,124,.12);
  animation:pulse 1.5s infinite;
}

@keyframes pulse{
  50%{
    opacity:.5;
    box-shadow:0 0 0 8px rgba(49,209,124,0);
  }
}

/* البحث */

.toolbar{
  display:grid;
  grid-template-columns:1fr auto;
  gap:10px;
  margin:15px 0;
}

.filters{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
}

.filter{
  border:1px solid var(--line);
  background:#1c161e;
  color:var(--muted);
  padding:10px 13px;
  border-radius:999px;
  font-weight:800;
}

.filter.active{
  background:rgba(245,138,174,.13);
  border-color:rgba(245,138,174,.45);
  color:#ffd8e5;
}

/* التحديد */

.bulkbar{
  display:flex;
  align-items:center;
  gap:9px;
  flex-wrap:wrap;
  padding:11px 12px;
  margin-bottom:14px;
  border-radius:17px;
  background:rgba(23,18,25,.9);
  border:1px solid var(--line);
}

.bulkbar .spacer{
  flex:1;
}

.check{
  width:19px;
  height:19px;
  accent-color:var(--pink);
}

.btn{
  padding:10px 12px;
  border-radius:13px;
  border:1px solid var(--line);
  background:#231b26;
  color:white;
  font-weight:850;
}

.btn:disabled{
  opacity:.4;
  cursor:not-allowed;
}

.confirm{
  color:#8df0ba;
  border-color:rgba(49,209,124,.28);
  background:rgba(49,209,124,.1);
}

.archive{
  color:#abc8ff;
  border-color:rgba(117,167,255,.25);
  background:rgba(117,167,255,.08);
}

.restore{
  color:#8df0ba;
  border-color:rgba(49,209,124,.25);
  background:rgba(49,209,124,.08);
}

.danger{
  color:#ff9aa7;
  border-color:rgba(255,107,125,.28);
  background:rgba(255,107,125,.08);
}

/* الطلبات */

.orders{
  display:grid;
  gap:12px;
}

.order{
  padding:17px;
  border-radius:22px;
  background:rgba(23,18,25,.93);
  border:1px solid var(--line);
}

.orderHead{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:12px;
}

.orderTitle{
  display:flex;
  align-items:flex-start;
  gap:10px;
}

.orderNo{
  direction:ltr;
  text-align:right;
  color:var(--muted);
  font-size:12px;
}

.receiver{
  margin-top:4px;
  font-size:20px;
  font-weight:950;
}

.badge{
  display:inline-flex;
  padding:7px 10px;
  border-radius:999px;
  font-size:12px;
  font-weight:900;
  white-space:nowrap;
}

.badge.pending{
  color:#f6d887;
  border:1px solid rgba(243,201,105,.25);
  background:rgba(243,201,105,.12);
}

.badge.paid{
  color:#89efb8;
  border:1px solid rgba(49,209,124,.24);
  background:rgba(49,209,124,.11);
}

.badge.archived{
  color:#b8cfff;
  border:1px solid rgba(117,167,255,.25);
  background:rgba(117,167,255,.09);
}

.meta{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin:13px 0;
}

.chip{
  padding:7px 10px;
  border-radius:999px;
  border:1px solid #302635;
  background:#211a23;
  color:#d6cbd3;
  font-size:12px;
}

.actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:13px;
}

.details{
  display:none;
  margin-top:14px;
  padding-top:14px;
  border-top:1px solid rgba(255,255,255,.07);
}

.details.open{
  display:block;
}

.detailGrid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:9px;
}

.detail{
  padding:11px;
  border-radius:14px;
  background:#100d12;
}

.detail span{
  display:block;
  margin-bottom:4px;
  color:var(--muted);
  font-size:11px;
}

.detail b{
  font-size:13px;
  word-break:break-word;
}

.message{
  margin-top:9px;
  padding:12px;
  border-radius:14px;
  background:#100d12;
  line-height:1.8;
  white-space:pre-wrap;
}

.empty,
.loading{
  padding:40px 14px;
  text-align:center;
  color:var(--muted);
}

.toast{
  position:fixed;
  z-index:100;
  left:50%;
  bottom:20px;
  transform:translate(-50%,20px);
  opacity:0;
  pointer-events:none;
  padding:11px 15px;
  border-radius:14px;
  background:#211a23;
  border:1px solid var(--line);
  transition:.2s;
}

.toast.show{
  opacity:1;
  transform:translate(-50%,0);
}

@media(max-width:1000px){
  .stats{
    grid-template-columns:repeat(4,1fr);
  }
}

@media(max-width:700px){
  .stats{
    grid-template-columns:repeat(2,1fr);
  }

  .toolbar{
    grid-template-columns:1fr;
  }

  .detailGrid{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<div class="wrap">

  <!-- تسجيل الدخول -->
  <section id="login" class="login">

    <div class="brand">LAHZA ♡</div>

    <h1>لوحة الإدارة</h1>

    <div class="muted">
      سجّل دخولك بحساب الأدمن.
    </div>

    <div class="field">
      <label>الإيميل</label>
      <input
        id="email"
        class="input"
        type="email"
        autocomplete="username"
      >
    </div>

    <div class="field">
      <label>كلمة المرور</label>
      <input
        id="password"
        class="input"
        type="password"
        autocomplete="current-password"
      >
    </div>

    <button id="loginBtn" class="primary">
      دخول
    </button>

    <div
      id="loginError"
      style="margin-top:12px;color:#ff9aa7"
    ></div>

  </section>


  <!-- لوحة الإدارة -->
  <main id="app">

    <header class="top">

      <div>
        <div class="brand">LAHZA ♡</div>
        <div class="muted" style="font-size:12px;margin-top:3px">
          إدارة الطلبات
        </div>
      </div>

      <button id="logoutBtn" class="ghost">
        تسجيل خروج
      </button>

    </header>


    <!-- الإحصائيات -->
    <section class="stats">

      <div class="stat">
        <span>الطلبات النشطة</span>
        <b id="statAll">0</b>
      </div>

      <div class="stat">
        <span>بانتظار الدفع</span>
        <b id="statPending">0</b>
      </div>

      <div class="stat">
        <span>الطلبات المدفوعة</span>
        <b id="statPaid">0</b>
      </div>

      <div class="stat">
        <span>المحذوفة</span>
        <b id="statArchived">0</b>
      </div>

      <div class="stat">
        <span>إجمالي المبيعات</span>
        <b id="statSales">0.000</b>
        <span>د.ب</span>
      </div>

      <div class="stat">
        <span>إجمالي الزوار</span>
        <b id="statVisitors">0</b>
      </div>

      <div class="stat onlineStat">
        <span>
          <i class="liveDot"></i>
          أون لاين الآن
        </span>
        <b id="statOnline">0</b>
      </div>

    </section>


    <!-- البحث والفلاتر -->
    <section class="toolbar">

      <input
        id="search"
        class="input"
        placeholder="ابحث برقم الطلب أو الاسم أو رقم التلفون..."
      >

      <div class="filters">

        <button class="filter active" data-filter="all">
          الكل
        </button>

        <button class="filter" data-filter="pending">
          بانتظار الدفع
        </button>

        <button class="filter" data-filter="paid">
          مدفوع
        </button>

        <button class="filter" data-filter="archived">
          المحذوفة
        </button>

      </div>

    </section>


    <!-- التحديد الجماعي -->
    <section class="bulkbar">

      <input id="selectAll" class="check" type="checkbox">

      <label for="selectAll">
        تحديد الظاهر
      </label>

      <span id="selectedCount" class="muted">
        0 محدد
      </span>

      <span class="spacer"></span>

      <button id="archiveSelected" class="btn archive" disabled>
        حذف المحدد
      </button>

      <button id="deleteSelected" class="btn danger" disabled>
        🗑 حذف نهائي
      </button>

    </section>


    <section id="orders" class="orders">
      <div class="loading">
        جاري تحميل الطلبات...
      </div>
    </section>

  </main>

</div>

<div id="toast" class="toast"></div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* ======================================
   إعدادات Supabase
====================================== */

const SUPABASE_URL =
  "https://ltuyfewachzbazunuxmd.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_UL-3si425vxRnBAGcgtDJA_Xw5VB3yN";

const ADMIN_EMAIL =
  "adelhussain66@gmail.com";

const sb =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* ======================================
   المتغيرات
====================================== */

let orders = [];
let currentFilter = "all";
let selected = new Set();


const $ = selector =>
  document.querySelector(selector);


function esc(value){

  return String(value ?? "")
    .replace(
      /[&<>"']/g,
      char => ({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"
      }[char])
    );

}


function money(value){

  return (Number(value) || 0)
    .toFixed(3);

}


function formatDate(value){

  if(!value){
    return "—";
  }

  try{

    return new Intl.DateTimeFormat(
      "ar-BH",
      {
        dateStyle:"medium",
        timeStyle:"short"
      }
    ).format(
      new Date(value)
    );

  }catch{

    return value;

  }

}


function showToast(message){

  const el = $("#toast");

  el.textContent = message;
  el.classList.add("show");

  clearTimeout(showToast.timer);

  showToast.timer =
    setTimeout(
      () => el.classList.remove("show"),
      1900
    );

}


function getGiftUrl(token){

  const directory =
    location.pathname.replace(
      /admin\.html.*$/i,
      ""
    );

  return (
    location.origin +
    directory +
    "gift.html?token=" +
    encodeURIComponent(token)
  );

}


/* ======================================
   تسجيل الدخول
====================================== */

async function checkSession(){

  const {data} =
    await sb.auth.getSession();

  const user =
    data?.session?.user;

  if(
    user?.email?.toLowerCase()
    ===
    ADMIN_EMAIL.toLowerCase()
  ){

    showApp();

    await loadOrders();
    await refreshVisitorStats();

  }else{

    $("#login").style.display = "block";
    $("#app").style.display = "none";

  }

}


async function login(){

  $("#loginError").textContent = "";

  const button = $("#loginBtn");

  button.disabled = true;
  button.textContent = "جاري الدخول...";

  const email =
    $("#email").value.trim();

  const password =
    $("#password").value;

  if(
    email.toLowerCase()
    !==
    ADMIN_EMAIL.toLowerCase()
  ){

    $("#loginError").textContent =
      "هذا الحساب غير مصرح له.";

    button.disabled = false;
    button.textContent = "دخول";

    return;

  }


  const {data,error} =
    await sb.auth.signInWithPassword({
      email,
      password
    });


  button.disabled = false;
  button.textContent = "دخول";


  if(error){

    $("#loginError").textContent =
      error.message;

    return;

  }


  if(
    data.user?.email?.toLowerCase()
    !==
    ADMIN_EMAIL.toLowerCase()
  ){

    await sb.auth.signOut();

    $("#loginError").textContent =
      "هذا الحساب غير مصرح له.";

    return;

  }


  showApp();

  await loadOrders();
  await refreshVisitorStats();

}


function showApp(){

  $("#login").style.display = "none";
  $("#app").style.display = "block";

}


/* ======================================
   تحميل الطلبات
====================================== */

async function loadOrders(){

  $("#orders").innerHTML =
    '<div class="loading">جاري تحميل الطلبات...</div>';


  const {data,error} =
    await sb
      .from("orders")
      .select("*")
      .order(
        "created_at",
        {ascending:false}
      );


  if(error){

    $("#orders").innerHTML =
      `<div class="empty">
        تعذر تحميل الطلبات:
        ${esc(error.message)}
      </div>`;

    return;

  }


  orders = data || [];

  renderOrders();

}


/* ======================================
   فلترة الطلبات
====================================== */

function filteredOrders(){

  const query =
    $("#search")
      .value
      .trim()
      .toLowerCase();

  return orders.filter(order => {

    const archived =
      !!order.archived;

    const status =
      String(
        order.status || "pending"
      ).toLowerCase();


    if(
      currentFilter === "all"
      &&
      archived
    ){
      return false;
    }


    if(
      currentFilter === "archived"
      &&
      !archived
    ){
      return false;
    }


    if(
      currentFilter === "pending"
      &&
      (
        archived
        ||
        status !== "pending"
      )
    ){
      return false;
    }


    if(
      currentFilter === "paid"
      &&
      (
        archived
        ||
        status !== "paid"
      )
    ){
      return false;
    }


    if(!query){
      return true;
    }


    const phoneQuery =
      query.replace(/\D/g,"");

    const phone =
      String(order.phone || "")
        .replace(/\D/g,"");


    return (

      String(order.order_number || "")
        .toLowerCase()
        .includes(query)

      ||

      String(order.receiver || "")
        .toLowerCase()
        .includes(query)

      ||

      String(order.sender || "")
        .toLowerCase()
        .includes(query)

      ||

      (
        phoneQuery
        &&
        phone.includes(phoneQuery)
      )

    );

  });

}


/* ======================================
   الإحصائيات الخاصة بالطلبات
====================================== */

function updateOrderStats(){

  const active =
    orders.filter(
      order => !order.archived
    );


  const pending =
    active.filter(
      order =>
        String(order.status || "pending")
        .toLowerCase()
        ===
        "pending"
    );


  const paid =
    active.filter(
      order =>
        String(order.status || "")
        .toLowerCase()
        ===
        "paid"
    );


  const archived =
    orders.filter(
      order => !!order.archived
    );


  const sales =
    orders
      .filter(
        order =>
          String(order.status || "")
          .toLowerCase()
          ===
          "paid"
      )
      .reduce(
        (sum,order) =>
          sum + (Number(order.price) || 0),
        0
      );


  $("#statAll").textContent =
    active.length;

  $("#statPending").textContent =
    pending.length;

  $("#statPaid").textContent =
    paid.length;

  $("#statArchived").textContent =
    archived.length;

  $("#statSales").textContent =
    money(sales);

}


/* ======================================
   عرض الطلبات
====================================== */

function renderOrders(){

  updateOrderStats();

  const list =
    filteredOrders();


  if(!list.length){

    $("#orders").innerHTML =
      '<div class="empty">ما في طلبات تطابق البحث.</div>';

    updateBulkUI();

    return;

  }


  $("#orders").innerHTML =
    list.map(order => {

      const paid =
        String(order.status || "")
          .toLowerCase()
        ===
        "paid";

      const archived =
        !!order.archived;

      const photos =
        Array.isArray(order.photos)
        ? order.photos.length
        : 0;


      let badgeClass = "pending";
      let badgeText = "بانتظار الدفع";


      if(paid){

        badgeClass = "paid";
        badgeText = "مدفوع ✓";

      }


      if(archived){

        badgeClass = "archived";
        badgeText = "محذوف";

      }


      return `

      <article class="order">

        <div class="orderHead">

          <div class="orderTitle">

            <input
              type="checkbox"
              class="check orderCheck"
              data-id="${esc(order.id)}"
              ${selected.has(order.id) ? "checked" : ""}
            >

            <div>

              <div class="orderNo">
                ${esc(
                  order.order_number ||
                  order.id
                )}
              </div>

              <div class="receiver">
                ${esc(
                  order.receiver ||
                  "بدون اسم"
                )}
              </div>

            </div>

          </div>


          <span class="badge ${badgeClass}">
            ${badgeText}
          </span>

        </div>


        <div class="meta">

          <span class="chip">
            ${esc(
              String(order.plan || "—")
                .toUpperCase()
            )}
          </span>

          <span class="chip">
            ${money(order.price)} د.ب
          </span>

          <span class="chip">
            ${esc(
              order.occasion ||
              "بدون مناسبة"
            )}
          </span>

          ${
            order.phone
            ?
            `<span class="chip">
              📱 ${esc(order.phone)}
            </span>`
            :
            ""
          }

          ${
            order.auto_send && order.recipient_phone
            ?
            `<span class="chip">
              🎁 إرسال للمستلم: ${esc(order.recipient_phone)}
            </span>`
            :
            ""
          }

          ${
            photos
            ?
            `<span class="chip">
              ${photos} صور
            </span>`
            :
            ""
          }

          ${
            order.audio_url
            ?
            '<span class="chip">موسيقى</span>'
            :
            ""
          }

          ${
            order.voice_url
            ?
            '<span class="chip">فويس</span>'
            :
            ""
          }

          ${
            order.video_url
            ?
            '<span class="chip">فيديو</span>'
            :
            ""
          }

        </div>


        <div class="actions">

          ${
            !paid && !archived
            ?
            `
            <button
              class="btn confirm"
              onclick="confirmPayment('${esc(order.id)}')"
            >
              تأكيد الدفع
            </button>
            `
            :
            ""
          }


          ${
            paid
            ?
            `
            <button
              class="btn"
              onclick="copyGift('${esc(order.gift_token || "")}')"
            >

/* ======================================
   واتساب العميل
====================================== */

function normalizeWhatsAppNumber(value){

  let number =
    String(value || "")
      .replace(/\D/g,"");


  if(number.startsWith("00")){

    number =
      number.slice(2);

  }


  if(number.length === 8){

    number =
      "973" + number;

  }


  return number;

}


function openCustomerWhatsApp(id){

  const order =
    orders.find(
      item => item.id === id
    );


  if(!order){
    return;
  }


  const number =
    normalizeWhatsAppNumber(
      order.phone
    );


  if(!number){

    alert(
      "ما في رقم واتساب محفوظ لهذا الطلب."
    );

    return;

  }


  if(
    String(order.status || "")
      .toLowerCase()
    !==
    "paid"
  ){

    alert(
      "أكد الدفع أول قبل إرسال رابط الهدية."
    );

    return;

  }


  const giftLink =
    getGiftUrl(
      order.gift_token
    );


  const message =
`هلا 👋
تم تأكيد طلبك في LAHZA ♡

رقم الطلب: ${order.order_number || "—"}

وهذا رابط الهدية:
${giftLink}

نتمنى لكم لحظة جميلة ♡`;


  window.open(
    "https://wa.me/" +
    number +
    "?text=" +
    encodeURIComponent(message),
    "_blank",
    "noopener,noreferrer"
  );

}

/* ======================================
   استخراج ملفات الطلب
====================================== */

function extractStoragePaths(order){

  const paths = [];


  function add(value){

    if(
      !value
      ||
      typeof value !== "string"
    ){
      return;
    }


    let path =
      value.trim();


    if(
      /^https?:\/\//i.test(path)
    ){

      try{

        const url =
          new URL(path);

        const marker =
          "/gift-media/";

        const index =
          url.pathname.indexOf(marker);


        if(index < 0){
          return;
        }


        path =
          decodeURIComponent(
            url.pathname.slice(
              index + marker.length
            )
          );

      }catch{

        return;

      }

    }


    path =
      path
        .replace(
          /^storage-(?:audio|video):/,
          ""
        )
        .replace(/^\/+/,"")
        .replace(/^gift-media\//,"");


    if(path){

      paths.push(path);

    }

  }


  if(
    Array.isArray(order.photos)
  ){

    order.photos.forEach(photo => {

      if(typeof photo === "string"){

        add(photo);

      }else{

        add(
          photo?.path ||
          photo?.url ||
          ""
        );

      }

    });

  }


  add(order.audio_url);
  add(order.voice_url);
  add(order.video_url);
  add(order.featured_photo);


  return [...new Set(paths)];

}


/* ======================================
   حذف نهائي
====================================== */

async function deleteOrder(id){

  const order =
    orders.find(
      item => item.id === id
    );


  if(!order){
    return;
  }


  const paid =
    String(order.status || "")
      .toLowerCase()
    ===
    "paid";


  const message =
    paid
    ?
`⚠️ هذا الطلب مدفوع.

متأكد تبي تحذف الطلب ${order.order_number || ""} نهائيًا؟

رابط الهدية بيتوقف.`
    :
`متأكد تبي تحذف الطلب ${order.order_number || ""} نهائيًا؟

رابط الهدية بيتوقف.`;


  if(!confirm(message)){
    return;
  }


  const paths =
    extractStoragePaths(order);


  if(paths.length){

    try{

      const {error:storageError} =
        await sb.storage
          .from("gift-media")
          .remove(paths);


      if(storageError){

        console.warn(
          "تعذر حذف بعض الملفات:",
          storageError.message
        );

      }

    }catch(error){

      console.warn(error);

    }

  }


  const {error} =
    await sb
      .from("orders")
      .delete()
      .eq("id",id);


  if(error){

    alert(
      "تعذر حذف الطلب نهائيًا: " +
      error.message
    );

    return;

  }


  orders =
    orders.filter(
      item => item.id !== id
    );


  selected.delete(id);

  renderOrders();

  showToast(
    "تم حذف الطلب نهائيًا"
  );

}


/* ======================================
   التحديد الجماعي
====================================== */

function visibleIds(){

  return filteredOrders()
    .map(order => order.id);

}


function updateBulkUI(){

  const visible =
    visibleIds();


  const selectedVisible =
    visible.filter(
      id => selected.has(id)
    );


  $("#selectedCount").textContent =
    selected.size + " محدد";


  $("#archiveSelected").disabled =
    selected.size === 0;


  $("#deleteSelected").disabled =
    selected.size === 0;


  $("#selectAll").checked =
    visible.length > 0
    &&
    selectedVisible.length
    ===
    visible.length;


  $("#selectAll").indeterminate =
    selectedVisible.length > 0
    &&
    selectedVisible.length
    <
    visible.length;

}


/* ======================================
   حذف جماعي عادي
====================================== */

async function archiveSelectedOrders(){

  const ids =
    [...selected];


  if(!ids.length){
    return;
  }


  if(
    !confirm(
`حذف ${ids.length} طلب من لوحة الإدارة؟

روابط الهدايا عند العملاء بتظل شغالة.`
    )
  ){
    return;
  }


  const archivedAt =
    new Date().toISOString();


  const {error} =
    await sb
      .from("orders")
      .update({
        archived:true,
        archived_at:archivedAt
      })
      .in("id",ids);


  if(error){

    alert(
      "تعذر حذف الطلبات: " +
      error.message
    );

    return;

  }


  orders.forEach(order => {

    if(selected.has(order.id)){

      order.archived = true;
      order.archived_at = archivedAt;

    }

  });


  selected.clear();

  renderOrders();

  showToast(
    "تم حذف الطلبات من لوحة الإدارة"
  );

}


/* ======================================
   حذف جماعي نهائي
====================================== */

async function deleteSelectedOrders(){

  const ids =
    [...selected];


  if(!ids.length){
    return;
  }


  if(
    !confirm(
`⚠️ حذف نهائي

متأكد تبي تحذف ${ids.length} طلب نهائيًا؟

روابط الهدايا لهذي الطلبات بتتوقف.`
    )
  ){
    return;
  }


  const chosen =
    orders.filter(
      order => selected.has(order.id)
    );


  for(const order of chosen){

    const paths =
      extractStoragePaths(order);


    if(paths.length){

      try{

        await sb.storage
          .from("gift-media")
          .remove(paths);

      }catch(error){

        console.warn(error);

      }

    }

  }


  const {error} =
    await sb
      .from("orders")
      .delete()
      .in("id",ids);


  if(error){

    alert(
      "تعذر حذف الطلبات نهائيًا: " +
      error.message
    );

    return;

  }


  orders =
    orders.filter(
      order => !selected.has(order.id)
    );


  selected.clear();

  renderOrders();

  showToast(
    "تم الحذف النهائي"
  );

}


/* ======================================
   إحصائيات الزوار

   مهم:
   الأدمن هنا لا يشغل analytics.js
   لذلك دخولك للأدمن لا ينحسب كزائر.
====================================== */

async function getVisitorStats(){

  try{

    const response =
      await fetch(
        SUPABASE_URL +
        "/rest/v1/rpc/get_site_stats",
        {
          method:"POST",

          headers:{
            apikey:SUPABASE_KEY,
            Authorization:
              "Bearer " +
              SUPABASE_KEY,
            "Content-Type":
              "application/json"
          },

          body:"{}"
        }
      );


    if(!response.ok){

      throw new Error(
        await response.text()
      );

    }


    const data =
      await response.json();


    return Array.isArray(data)
      ?
      data[0]
      :
      data;

  }catch(error){

    console.warn(
      "Visitor stats:",
      error
    );


    return {
      total_visitors:0,
      online_now:0
    };

  }

}


async function refreshVisitorStats(){

  const stats =
    await getVisitorStats();


  /* en-US = الأرقام تطلع 1 2 3 */
  $("#statVisitors").textContent =
    Number(
      stats?.total_visitors || 0
    ).toLocaleString("en-US");


  $("#statOnline").textContent =
    Number(
      stats?.online_now || 0
    ).toLocaleString("en-US");

}
