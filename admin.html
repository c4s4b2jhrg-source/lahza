<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#08080f">

<title>لوحة الإدارة | LAHZA</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  min-height:100vh;
  background:
    radial-gradient(circle at top right,rgba(255,79,135,.15),transparent 35%),
    #08080f;
  color:white;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}

header{
  width:min(94%,1000px);
  margin:auto;
  padding:22px 0;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-size:23px;
  font-weight:900;
}

.logo span{
  color:#ff4f87;
}

.logout{
  display:none;
  border:1px solid #292934;
  background:#15151e;
  color:#aaa;
  padding:10px 15px;
  border-radius:12px;
  cursor:pointer;
}

main{
  width:min(94%,1000px);
  margin:auto;
  padding-bottom:60px;
}

.loginBox{
  width:min(100%,440px);
  margin:70px auto;
  background:#111118;
  border:1px solid #25252f;
  border-radius:25px;
  padding:25px;
}

.loginBox h1{
  margin:0 0 8px;
  text-align:center;
}

.loginBox p{
  color:#777;
  text-align:center;
  line-height:1.8;
  margin:0 0 25px;
}

label{
  display:block;
  color:#aaa;
  font-size:13px;
  margin:14px 2px 7px;
}

input{
  width:100%;
  background:#0b0b11;
  border:1px solid #292934;
  color:white;
  padding:15px;
  border-radius:13px;
  outline:none;
  font:inherit;
}

input:focus{
  border-color:#ff4f87;
}

.loginBtn{
  width:100%;
  margin-top:18px;
  border:0;
  border-radius:14px;
  padding:15px;
  background:linear-gradient(135deg,#ff3474,#ff6999);
  color:white;
  font-size:16px;
  font-weight:900;
  cursor:pointer;
}

.loginBtn:disabled{
  opacity:.5;
}

.error{
  display:none;
  margin-top:14px;
  padding:12px;
  border-radius:12px;
  background:rgba(255,50,80,.10);
  border:1px solid rgba(255,70,100,.25);
  color:#ff8294;
  line-height:1.7;
  font-size:13px;
}

.dashboard{
  display:none;
}

.topTitle{
  margin:25px 0;
}

.topTitle h1{
  margin:0 0 7px;
}

.topTitle p{
  color:#777;
  margin:0;
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-bottom:20px;
}

.stat{
  background:#111118;
  border:1px solid #25252f;
  border-radius:18px;
  padding:17px;
}

.stat span{
  color:#777;
  font-size:12px;
}

.stat strong{
  display:block;
  margin-top:7px;
  font-size:25px;
}

.orders{
  display:grid;
  gap:13px;
}

.order{
  background:#111118;
  border:1px solid #25252f;
  border-radius:21px;
  padding:19px;
}

.orderTop{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:15px;
  margin-bottom:15px;
}

.orderNumber{
  color:#ff6d9c;
  font-weight:900;
}

.status{
  padding:7px 11px;
  border-radius:50px;
  font-size:12px;
  font-weight:900;
}

.pending{
  color:#e8bd68;
  background:rgba(255,174,0,.10);
}

.paid{
  color:#87d89f;
  background:rgba(39,190,88,.10);
}

.info{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px;
}

.infoBox{
  background:#0b0b11;
  border-radius:13px;
  padding:12px;
}

.infoBox span{
  color:#666;
  font-size:11px;
}

.infoBox strong{
  display:block;
  margin-top:5px;
  overflow-wrap:anywhere;
}

.message{
  margin-top:10px;
  background:#0b0b11;
  border-radius:13px;
  padding:14px;
  color:#ccc;
  line-height:1.8;
  white-space:pre-wrap;
}

.actions{
  margin-top:14px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
}

.confirmBtn,
.copyBtn{
  border:0;
  padding:13px;
  border-radius:13px;
  font-weight:900;
  cursor:pointer;
}

.confirmBtn{
  background:#25a85a;
  color:white;
}

.confirmBtn:disabled{
  opacity:.5;
  cursor:not-allowed;
}

.copyBtn{
  background:#24242e;
  color:white;
}

.giftLink{
  display:none;
  margin-top:12px;
  padding:13px;
  border-radius:13px;
  background:rgba(39,190,88,.07);
  border:1px solid rgba(39,190,88,.20);
  color:#8dd9a3;
  direction:ltr;
  overflow-wrap:anywhere;
  font-size:12px;
}

.empty{
  padding:40px;
  text-align:center;
  color:#777;
  background:#111118;
  border:1px solid #25252f;
  border-radius:20px;
}

.refresh{
  margin-bottom:15px;
  border:1px solid #292934;
  background:#15151e;
  color:white;
  padding:10px 15px;
  border-radius:12px;
  cursor:pointer;
}

@media(max-width:650px){
  .stats{
    grid-template-columns:1fr;
  }

  .info{
    grid-template-columns:1fr;
  }

  .actions{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">
    LAHZA <span>♡</span> ADMIN
  </div>

  <button
    id="logoutBtn"
    class="logout"
    onclick="logout()">
    تسجيل خروج
  </button>
</header>

<main>

<section
  id="loginBox"
  class="loginBox">

  <h1>دخول الإدارة 🔐</h1>

  <p>
    هذه الصفحة خاصة بإدارة طلبات LAHZA.
  </p>

  <label>الإيميل</label>

  <input
    id="email"
    type="email"
    autocomplete="username"
    value="adelhussain66@gmail.com"
  >

  <label>كلمة المرور</label>

  <input
    id="password"
    type="password"
    autocomplete="current-password"
    placeholder="••••••••"
  >

  <button
    id="loginBtn"
    class="loginBtn"
    onclick="login()">
    دخول
  </button>

  <div
    id="loginError"
    class="error">
  </div>

</section>


<section
  id="dashboard"
  class="dashboard">

  <div class="topTitle">
    <h1>طلبات LAHZA 🎁</h1>
    <p>
      تأكد من وصول التحويل قبل الضغط على تأكيد الدفع.
    </p>
  </div>

  <div class="stats">

    <div class="stat">
      <span>كل الطلبات</span>
      <strong id="totalCount">0</strong>
    </div>

    <div class="stat">
      <span>بانتظار الدفع</span>
      <strong id="pendingCount">0</strong>
    </div>

    <div class="stat">
      <span>مدفوعة</span>
      <strong id="paidCount">0</strong>
    </div>

  </div>

  <button
    class="refresh"
    onclick="loadOrders()">
    تحديث الطلبات ↻
  </button>

  <div
    id="orders"
    class="orders">
  </div>

</section>

</main>


<script>

const SUPABASE_URL =
  "https://ltuyfewachzbazunuxmd.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_UL-3si425vxRnBAGcgtDJA_Xw5VB3yN";

const ADMIN_EMAIL =
  "adelhussain66@gmail.com";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


const occasionNames = {
  love:"حب ❤️",
  birthday:"عيد ميلاد 🎂",
  friend:"صداقة 🫂",
  friendship:"صداقة 🫂",
  graduation:"تخرج 🎓",
  sorry:"اعتذار 🥹",
  apology:"اعتذار 🥹",
  surprise:"بدون مناسبة 🎁",
  none:"بدون مناسبة 🎁"
};

const planNames = {
  mini:"Mini",
  moment:"Moment",
  forever:"Forever"
};


/* =============================
   تسجيل الدخول
============================= */

async function login(){

  const email =
    document
    .getElementById("email")
    .value
    .trim();

  const password =
    document
    .getElementById("password")
    .value;

  const loginBtn =
    document.getElementById(
      "loginBtn"
    );

  const errorBox =
    document.getElementById(
      "loginError"
    );


  errorBox.style.display =
    "none";


  if(
    email.toLowerCase() !==
    ADMIN_EMAIL.toLowerCase()
  ){

    errorBox.textContent =
      "هذا الحساب غير مصرح له بدخول الإدارة.";

    errorBox.style.display =
      "block";

    return;
  }


  if(!password){

    errorBox.textContent =
      "اكتب كلمة المرور.";

    errorBox.style.display =
      "block";

    return;
  }


  loginBtn.disabled =
    true;

  loginBtn.textContent =
    "جاري الدخول...";


  const {
    data,
    error
  } =
    await supabaseClient
    .auth
    .signInWithPassword({
      email,
      password
    });


  if(error){

    console.error(error);

    errorBox.textContent =
      "الإيميل أو كلمة المرور غير صحيحة.";

    errorBox.style.display =
      "block";

    loginBtn.disabled =
      false;

    loginBtn.textContent =
      "دخول";

    return;
  }


  if(
    !data.user ||
    data.user.email.toLowerCase() !==
    ADMIN_EMAIL.toLowerCase()
  ){

    await supabaseClient
    .auth
    .signOut();

    errorBox.textContent =
      "غير مصرح لهذا الحساب.";

    errorBox.style.display =
      "block";

    loginBtn.disabled =
      false;

    loginBtn.textContent =
      "دخول";

    return;
  }


  showDashboard();

}


/* =============================
   فحص الجلسة
============================= */

async function checkSession(){

  const {
    data
  } =
    await supabaseClient
    .auth
    .getSession();


  const session =
    data.session;


  if(
    session &&
    session.user &&
    session.user.email &&
    session.user.email.toLowerCase() ===
    ADMIN_EMAIL.toLowerCase()
  ){

    showDashboard();

  }

}


/* =============================
   إظهار لوحة الإدارة
============================= */

function showDashboard(){

  document
  .getElementById("loginBox")
  .style.display =
    "none";

  document
  .getElementById("dashboard")
  .style.display =
    "block";

  document
  .getElementById("logoutBtn")
  .style.display =
    "block";

  loadOrders();

}


/* =============================
   تحميل الطلبات
============================= */

async function loadOrders(){

  const ordersBox =
    document.getElementById(
      "orders"
    );


  ordersBox.innerHTML =
    '<div class="empty">جاري تحميل الطلبات...</div>';


  const {
    data,
    error
  } =
    await supabaseClient
    .from("orders")
    .select(
      "id,order_number,receiver,sender,message,gift_date,occasion,plan,theme,price,status,gift_token,created_at,paid_at"
    )
    .order(
      "created_at",
      {
        ascending:false
      }
    );


  if(error){

    console.error(
      "Load orders error:",
      error
    );


    ordersBox.innerHTML =
      '<div class="empty">تعذر تحميل الطلبات.</div>';

    return;
  }


  updateStats(
    data || []
  );


  if(
    !data ||
    data.length === 0
  ){

    ordersBox.innerHTML =
      '<div class="empty">ما عندك طلبات حاليًا 🤍</div>';

    return;
  }


  ordersBox.innerHTML =
    "";


  data.forEach(
    function(order){

      ordersBox.appendChild(
        createOrderCard(
          order
        )
      );

    }
  );

}


/* =============================
   الإحصائيات
============================= */

function updateStats(orders){

  const pending =
    orders.filter(
      order =>
        order.status ===
        "pending"
    ).length;


  const paid =
    orders.filter(
      order =>
        order.status ===
        "paid"
    ).length;


  document
  .getElementById("totalCount")
  .textContent =
    orders.length;


  document
  .getElementById("pendingCount")
  .textContent =
    pending;


  document
  .getElementById("paidCount")
  .textContent =
    paid;

}


/* =============================
   بطاقة الطلب
============================= */

function createOrderCard(order){

  const card =
    document.createElement(
      "div"
    );


  card.className =
    "order";


  const giftURL =
    buildGiftURL(
      order.gift_token
    );


  const statusText =
    order.status === "paid"
    ? "مدفوع ✓"
    : "بانتظار الدفع";


  const statusClass =
    order.status === "paid"
    ? "paid"
    : "pending";


  card.innerHTML = `

    <div class="orderTop">

      <div>
        <div class="orderNumber">
          ${escapeHTML(order.order_number || "—")}
        </div>
      </div>

      <div class="status ${statusClass}">
        ${statusText}
      </div>

    </div>


    <div class="info">

      <div class="infoBox">
        <span>المستلم</span>
        <strong>
          ${escapeHTML(order.receiver || "—")}
        </strong>
      </div>

      <div class="infoBox">
        <span>المرسل</span>
        <strong>
          ${escapeHTML(order.sender || "مجهول")}
        </strong>
      </div>

      <div class="infoBox">
        <span>المناسبة</span>
        <strong>
          ${escapeHTML(
            occasionNames[order.occasion] ||
            order.occasion ||
            "—"
          )}
        </strong>
      </div>

      <div class="infoBox">
        <span>الباقة</span>
        <strong>
          ${escapeHTML(
            planNames[order.plan] ||
            order.plan ||
            "—"
          )}
        </strong>
      </div>

      <div class="infoBox">
        <span>السعر</span>
        <strong>
          ${Number(order.price || 0).toFixed(3)} د.ب
        </strong>
      </div>

      <div class="infoBox">
        <span>التاريخ</span>
        <strong>
          ${escapeHTML(order.gift_date || "بدون تاريخ")}
        </strong>
      </div>

    </div>


    <div class="message">
      ${escapeHTML(order.message || "")}
    </div>


    <div class="actions">

      <button
        class="confirmBtn"
        ${order.status === "paid" ? "disabled" : ""}
        onclick="confirmPayment(
          '${order.id}',
          '${order.order_number}'
        )">

        ${
          order.status === "paid"
          ? "تم تأكيد الدفع ✓"
          : "تأكيد الدفع ✓"
        }

      </button>


      <button
        class="copyBtn"
        onclick="copyGiftLink(
          '${giftURL}'
        )">

        نسخ رابط الهدية 🔗

      </button>

    </div>


    <div
      class="giftLink"
      style="${
        order.status === "paid"
        ? "display:block"
        : "display:none"
      }">

      ${order.status === "paid"
        ? giftURL
        : ""
      }

    </div>

  `;


  return card;

}


/* =============================
   تأكيد الدفع
============================= */

async function confirmPayment(
  orderId,
  orderNumber
){

  const confirmed =
    confirm(
      "هل تأكدت أن مبلغ الطلب " +
      orderNumber +
      " وصل فعلًا؟"
    );


  if(!confirmed){
    return;
  }


  const {
    error
  } =
    await supabaseClient
    .from("orders")
    .update({

      status:"paid",

      paid_at:
        new Date()
        .toISOString()

    })
    .eq(
      "id",
      orderId
    );


  if(error){

    console.error(
      "Payment update error:",
      error
    );


    alert(
      "تعذر تأكيد الدفع."
    );

    return;
  }


  alert(
    "تم تأكيد الدفع ✓"
  );


  loadOrders();

}


/* =============================
   رابط الهدية
============================= */

function buildGiftURL(token){

  const directory =
    window.location.pathname
    .replace(
      /admin\.html.*$/i,
      ""
    );


  return (
    window.location.origin +
    directory +
    "gift.html?token=" +
    encodeURIComponent(token)
  );

}


/* =============================
   نسخ الرابط
============================= */

async function copyGiftLink(url){

  try{

    await navigator
    .clipboard
    .writeText(url);


    alert(
      "تم نسخ رابط الهدية 🔗"
    );

  }catch(error){

    prompt(
      "انسخ رابط الهدية:",
      url
    );

  }

}


/* =============================
   تسجيل الخروج
============================= */

async function logout(){

  await supabaseClient
  .auth
  .signOut();


  location.reload();

}


/* =============================
   حماية النصوص
============================= */

function escapeHTML(text){

  const div =
    document.createElement(
      "div"
    );


  div.textContent =
    String(text);


  return div.innerHTML;

}


checkSession();

</script>

</body>
</html>
