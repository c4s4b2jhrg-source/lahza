<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>LAHZA | لحظة خاصة ♡</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  font-family:Arial,sans-serif;
  color:white;
  background:
    radial-gradient(circle at 50% 25%,#35101f 0%,#130c17 38%,#080811 75%);
  overflow-x:hidden;
}

.wrap{
  width:min(92%,700px);
  margin:auto;
  min-height:100vh;
  padding:45px 0 60px;
  text-align:center;
}

.logo{
  font-size:30px;
  font-weight:900;
  margin-bottom:70px;
}
.logo span{color:#ff477e}

#closed{
  animation:fade .8s ease;
}

.envelope{
  font-size:95px;
  filter:drop-shadow(0 0 25px rgba(255,71,126,.35));
  animation:float 2.5s ease-in-out infinite;
}

h1{
  font-size:clamp(34px,7vw,55px);
  margin:15px 0 10px;
}

.small{
  color:#aaa;
  font-size:18px;
  line-height:1.8;
}

.name{
  color:#ff5a8b;
  font-weight:900;
}

button{
  border:0;
  cursor:pointer;
  color:#fff;
  font-size:19px;
  font-weight:800;
  padding:18px 35px;
  border-radius:18px;
  background:linear-gradient(135deg,#ff1768,#ff6091);
  box-shadow:0 12px 35px rgba(255,23,104,.28);
  margin-top:28px;
}

button:active{transform:scale(.97)}

#gift{
  display:none;
  animation:openGift .8s cubic-bezier(.2,.8,.2,1);
}

.badge{
  display:inline-block;
  background:rgba(255,71,126,.16);
  color:#ff7ca3;
  border:1px solid rgba(255,71,126,.25);
  padding:9px 22px;
  border-radius:50px;
  font-weight:bold;
  margin:15px 0;
}

.card{
  width:100%;
  max-width:620px;
  margin:30px auto;
  padding:38px 28px;
  border-radius:32px;

  background:
    radial-gradient(circle at top right,
    rgba(255,71,126,.14),
    transparent 40%),
    rgba(255,255,255,.055);

  border:1px solid rgba(255,255,255,.14);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);

  box-shadow:
    0 25px 70px rgba(0,0,0,.40),
    inset 0 1px 0 rgba(255,255,255,.08);

  overflow:hidden;
}

.message{
  font-size:25px;
  line-height:1.9;
  white-space:pre-wrap;
  margin:20px 0;

  width:100%;
  max-width:100%;
  overflow-wrap:anywhere;
  word-break:break-word;
  text-align:center;
}

.date{
  color:#bbb;
  margin:20px 0;
}

.from{
  margin-top:25px;
  color:#ccc;
}
.from b{color:#ff6f9b}

#giftImage{
  display:none;
  width:auto;
  max-width:100%;
  max-height:500px;
  height:auto;
  object-fit:contain;
  border-radius:22px;
  margin:25px auto;
  box-shadow:0 15px 40px rgba(0,0,0,.35);
}

.music{
  display:none;
  margin:25px 0;
  padding:18px;
  border-radius:18px;
  background:rgba(255,255,255,.07);
}

.music a{
  color:#ff7ca3;
  text-decoration:none;
  font-weight:bold;
}

.share{
  margin-top:35px;
}

.share button{
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.13);
  box-shadow:none;
}

.footer{
  margin-top:60px;
  color:#666;
  font-size:14px;
}

.heart{
  position:fixed;
  bottom:-40px;
  opacity:.25;
  pointer-events:none;
  animation:rise linear forwards;
}

@keyframes float{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-12px)}
}

@keyframes fade{
  from{opacity:0}
  to{opacity:1}
}

@keyframes openGift{
  from{
    opacity:0;
    transform:translateY(30px) scale(.96)
  }
  to{
    opacity:1;
    transform:none
  }
}

@keyframes rise{
  to{
    transform:translateY(-115vh) rotate(25deg);
    opacity:0;
  }
}

@media(max-width:600px){
  .wrap{padding-top:30px}
  .logo{margin-bottom:55px;font-size:25px}
  .card{padding:28px 20px}
  .message{font-size:21px}
}
</style>
</head>

<body>

<div class="wrap">

  <div class="logo"><span>♡</span> LAHZA</div>

  <!-- قبل فتح الهدية -->
  <section id="closed">

    <div class="envelope">💌</div>

    <h1>عندك لحظة<br>من شخص يفكر فيك</h1>

    <p class="small">
      <span id="beforeName" class="name"></span>
      فيه شيء صغير انصنع مخصوص لك ♡
    </p>

    <button onclick="openGift()">
      افتح هديتك ♡
    </button>

  </section>


  <!-- بعد فتح الهدية -->
  <section id="gift">

    <p class="small">هذه اللحظة إلى</p>

    <h1>
      <span id="receiver"></span> ♡
    </h1>

    <div id="occasion" class="badge"></div>

    <div class="card">

      <img id="giftImage">

      <div id="message" class="message"></div>

      <div id="date" class="date"></div>

      <div class="from">
        من ♡ <b id="sender"></b>
      </div>

      <div id="musicBox" class="music">
        🎵 فيه أغنية مع هاللحظة<br><br>
        <a id="musicLink" target="_blank">
          افتح الأغنية ♡
        </a>
      </div>

    </div>

    <div class="share">
      <p class="small">عجبتك اللحظة؟ اصنع وحدة لشخص يعني لك الكثير ♡</p>

      <button onclick="location.href='index.html'">
        اصنع لحظتك ✨
      </button>
    </div>

  </section>

  <div class="footer">
    صنعت بحب بواسطة LAHZA ♡
  </div>

</div>


<script>
const params = new URLSearchParams(location.search);

let data = {};

try{
  data = JSON.parse(localStorage.getItem("lahzaGift")) || {};
}catch(e){
  data = {};
}

function getValue(key){
  return params.get(key) || data[key] || "";
}

const receiver = getValue("receiver");
const sender = getValue("sender");
const message = getValue("message");
const occasion = getValue("occasion");
const date = getValue("date");

const song =
  getValue("song") ||
  getValue("music");

document.getElementById("receiver").textContent =
  receiver || "شخص مميز";

document.getElementById("beforeName").textContent =
  receiver ? receiver + "، " : "";

document.getElementById("sender").textContent =
  sender || "شخص يفكر فيك";

document.getElementById("message").textContent =
  message || "فيه كلام ما ينقال بأي طريقة… لذلك انصنعت لك هاللحظة ♡";

document.getElementById("occasion").textContent =
  occasion || "لحظة خاصة";

if(date){
  document.getElementById("date").textContent =
    "📅 " + date;
}else{
  document.getElementById("date").style.display="none";
}

if(song){
  document.getElementById("musicBox").style.display="block";
  document.getElementById("musicLink").href=song;
}


/* فتح الهدية */
function openGift(){

  document.getElementById("closed").style.display="none";
  document.getElementById("gift").style.display="block";

  hearts();

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });
}


/* القلوب */
function hearts(){

  for(let i=0;i<18;i++){

    setTimeout(()=>{

      const h=document.createElement("div");

      h.className="heart";
      h.innerHTML="♡";

      h.style.left=Math.random()*100+"vw";
      h.style.fontSize=(18+Math.random()*28)+"px";
      h.style.color="#ff4f82";
      h.style.animationDuration=(4+Math.random()*4)+"s";

      document.body.appendChild(h);

      setTimeout(()=>h.remove(),8000);

    },i*100);
  }
}
</script>

</body>
</html>
