<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لحظة خاصة ♡ | LAHZA</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  min-height:100vh;
  background:
    radial-gradient(circle at 50% 25%,#35101f 0%,#140912 38%,#080811 75%);
  color:white;
  overflow-x:hidden;
}

/* القلوب بالخلفية */
.heart{
  position:fixed;
  bottom:-40px;
  color:#ff4f8b;
  opacity:.18;
  pointer-events:none;
  animation:floatUp linear infinite;
}

@keyframes floatUp{
  from{
    transform:translateY(0) rotate(0deg);
    opacity:0;
  }
  20%{opacity:.2;}
  to{
    transform:translateY(-110vh) rotate(25deg);
    opacity:0;
  }
}

/* شاشة فتح الهدية */
#cover{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:25px;
  text-align:center;
}

.coverBox{
  width:100%;
  max-width:500px;
}

.logo{
  position:absolute;
  top:28px;
  left:0;
  right:0;
  font-size:23px;
  font-weight:900;
  letter-spacing:1px;
}

.logo span{
  color:#ff4f88;
}

.envelope{
  font-size:75px;
  margin-bottom:25px;
  animation:pulse 1.8s infinite;
}

@keyframes pulse{
  0%,100%{transform:scale(1)}
  50%{transform:scale(1.08)}
}

.coverBox h1{
  font-size:34px;
  line-height:1.5;
  margin-bottom:12px;
}

.coverBox p{
  color:#aaa;
  font-size:17px;
  line-height:1.8;
  margin-bottom:30px;
}

.openBtn{
  border:0;
  padding:18px 35px;
  border-radius:20px;
  background:linear-gradient(135deg,#ff176c,#ff5c91);
  color:#fff;
  font-size:19px;
  font-weight:bold;
  cursor:pointer;
  box-shadow:0 15px 45px rgba(255,40,110,.25);
  transition:.2s;
}

.openBtn:active{
  transform:scale(.96);
}

/* محتوى الهدية */
#gift{
  display:none;
  min-height:100vh;
  padding:30px 18px 60px;
  text-align:center;
  animation:showGift .8s ease;
}

@keyframes showGift{
  from{
    opacity:0;
    transform:translateY(25px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

.giftWrap{
  width:100%;
  max-width:560px;
  margin:auto;
}

.brand{
  font-size:22px;
  font-weight:900;
  margin-bottom:55px;
}

.brand span{
  color:#ff4f88;
}

.forText{
  font-size:16px;
  color:#999;
  margin-bottom:8px;
}

.receiver{
  font-size:38px;
  margin-bottom:28px;
}

.receiver span{
  color:#ff5b91;
}

.messageCard{
  position:relative;
  padding:38px 25px;
  border-radius:28px;
  background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.1);
  backdrop-filter:blur(12px);
  box-shadow:0 25px 70px rgba(0,0,0,.25);
  overflow:hidden;
}

.messageCard:before{
  content:"";
  position:absolute;
  width:180px;
  height:180px;
  background:#ff2e75;
  filter:blur(100px);
  opacity:.12;
  top:-70px;
  right:-60px;
}

.occasion{
  display:inline-block;
  padding:8px 16px;
  background:rgba(255,73,132,.12);
  color:#ff75a4;
  border-radius:50px;
  margin-bottom:25px;
  font-size:14px;
}

.message{
  font-size:22px;
  line-height:2;
  white-space:pre-wrap;
  margin-bottom:25px;
}

.date{
  color:#888;
  font-size:14px;
  line-height:1.7;
}

.from{
  margin-top:28px;
  color:#aaa;
  font-size:16px;
}

.from strong{
  color:#ff6b9d;
}

/* الصورة */
#photoBox{
  display:none;
  margin-top:25px;
}

#giftPhoto{
  width:100%;
  max-height:500px;
  object-fit:cover;
  border-radius:25px;
  box-shadow:0 20px 50px rgba(0,0,0,.3);
}

/* الموسيقى */
#musicBox{
  display:none;
  margin-top:25px;
}

.musicBtn{
  width:100%;
  border:1px solid rgba(255,255,255,.1);
  background:rgba(255,255,255,.06);
  color:white;
  padding:17px;
  border-radius:18px;
  font-size:16px;
  cursor:pointer;
}

/* نهاية الهدية */
.end{
  margin-top:45px;
  padding-top:30px;
  border-top:1px solid rgba(255,255,255,.08);
}

.endText{
  color:#777;
  margin-bottom:18px;
}

.createBtn{
  display:block;
  text-decoration:none;
  background:white;
  color:#151018;
  font-weight:bold;
  padding:17px;
  border-radius:18px;
  margin-bottom:12px;
}

.shareBtn{
  width:100%;
  border:1px solid rgba(255,255,255,.12);
  background:transparent;
  color:white;
  padding:16px;
  border-radius:18px;
  font-size:16px;
  cursor:pointer;
}

.smallBrand{
  margin-top:35px;
  color:#555;
  font-size:13px;
}

@media(max-width:500px){
  .coverBox h1{font-size:29px}
  .receiver{font-size:32px}
  .message{font-size:19px}
}
</style>
</head>

<body>

<div id="hearts"></div>

<!-- شاشة فتح الهدية -->
<section id="cover">

  <div class="logo">
    LAHZA <span>♡</span>
  </div>

  <div class="coverBox">

    <div class="envelope">💌</div>

    <h1>
      عندك لحظة<br>
      من شخص يفكر فيك
    </h1>

    <p id="coverText">
      فيه شيء صغير انصنع مخصوص لك ♡
    </p>

    <button class="openBtn" onclick="openGift()">
      افتح هديتك ♡
    </button>

  </div>
</section>


<!-- الهدية -->
<section id="gift">

  <div class="giftWrap">

    <div class="brand">
      LAHZA <span>♡</span>
    </div>

    <div class="forText">
      هذه اللحظة إلى
    </div>

    <h1 class="receiver">
      ♡ <span id="receiver"></span>
    </h1>

    <div class="messageCard">

      <div class="occasion" id="occasion"></div>

      <div class="message" id="message"></div>

      <div class="date" id="specialDate"></div>

      <div class="from">
        من <strong id="sender"></strong> ♡
      </div>

    </div>

    <div id="photoBox">
      <img id="giftPhoto" alt="ذكرى">
    </div>

    <div id="musicBox">
      <button class="musicBtn" id="musicButton">
        ♫ شغّل أغنيتكم
      </button>
    </div>

    <div class="end">

      <p class="endText">
        أعجبتك اللحظة؟ اصنع وحدة لشخص يعني لك الكثير.
      </p>

      <a href="occasion.html" class="createBtn">
        اصنع لحظة لشخص تحبه ♡
      </a>

      <button class="shareBtn" onclick="shareGift()">
        شارك هذه اللحظة
      </button>

    </div>

    <div class="smallBrand">
      صنعت بحب بواسطة LAHZA ♡
    </div>

  </div>
</section>


<script>

/* قراءة المعلومات من الرابط */
const params = new URLSearchParams(window.location.search);

const receiver =
  params.get("receiver") || "شخص مميز";

const occasion =
  params.get("occasion") || "لحظة خاصة";

const message =
  params.get("message") || "فيه كلام جميل انكتب مخصوص لك ♡";

const sender =
  params.get("sender") || "شخص يحبك";

const date =
  params.get("date");

const song =
  params.get("song");


/* وضع البيانات */
document.getElementById("receiver").textContent = receiver;
document.getElementById("occasion").textContent = occasion;
document.getElementById("message").textContent = message;
document.getElementById("sender").textContent = sender;

document.getElementById("coverText").textContent =
  receiver + "، فيه شيء صغير انصنع مخصوص لك ♡";


/* التاريخ */
if(date){

  const selectedDate = new Date(date);
  const today = new Date();

  const difference =
    Math.floor((today-selectedDate)/(1000*60*60*24));

  if(difference > 0){

    document.getElementById("specialDate").innerHTML =
      "مرت على هاللحظة <strong>" +
      difference +
      "</strong> يوم ♡";

  }else{

    document.getElementById("specialDate").textContent =
      "اليوم يومكم المميز ♡";

  }

}else{

  document.getElementById("specialDate").style.display="none";

}


/* الأغنية */
if(song){

  document.getElementById("musicBox").style.display="block";

  document.getElementById("musicButton").onclick=function(){

    window.open(song,"_blank");

  };

}


/* فتح الهدية */
function openGift(){

  const cover=document.getElementById("cover");
  const gift=document.getElementById("gift");

  cover.style.opacity="0";
  cover.style.transition=".5s";

  setTimeout(function(){

    cover.style.display="none";
    gift.style.display="block";

    window.scrollTo({
      top:0,
      behavior:"smooth"
    });

  },500);

}


/* مشاركة */
function shareGift(){

  if(navigator.share){

    navigator.share({
      title:"لحظة خاصة ♡",
      text:"فيه لحظة صنعت لك ♡",
      url:window.location.href
    });

  }else{

    navigator.clipboard.writeText(window.location.href);

    alert("تم نسخ رابط اللحظة ♡");

  }

}


/* قلوب متحركة */
const heartsContainer =
  document.getElementById("hearts");

for(let i=0;i<12;i++){

  const heart=document.createElement("div");

  heart.className="heart";
  heart.innerHTML="♡";

  heart.style.left=
    Math.random()*100+"%";

  heart.style.fontSize=
    (15+Math.random()*25)+"px";

  heart.style.animationDuration=
    (7+Math.random()*8)+"s";

  heart.style.animationDelay=
    (Math.random()*8)+"s";

  heartsContainer.appendChild(heart);

}

</script>

</body>
</html>
