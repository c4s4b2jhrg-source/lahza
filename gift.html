<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LAHZA | هديتك ♡</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    font-family:Arial,sans-serif;
    color:white;
    background:
        radial-gradient(circle at 20% 20%,rgba(255,45,115,.20),transparent 35%),
        radial-gradient(circle at 80% 80%,rgba(105,60,255,.15),transparent 35%),
        #080812;
    overflow-x:hidden;
}

/* القلوب بالخلفية */
.hearts{
    position:fixed;
    inset:0;
    pointer-events:none;
    overflow:hidden;
}

.heart{
    position:absolute;
    color:#ff3f7f;
    opacity:.15;
    animation:float 8s infinite ease-in-out;
}

.heart:nth-child(1){left:8%;top:20%;font-size:25px;}
.heart:nth-child(2){left:80%;top:15%;font-size:35px;animation-delay:2s;}
.heart:nth-child(3){left:15%;top:75%;font-size:30px;animation-delay:4s;}
.heart:nth-child(4){left:88%;top:65%;font-size:22px;animation-delay:1s;}
.heart:nth-child(5){left:50%;top:88%;font-size:20px;animation-delay:3s;}

@keyframes float{
    0%,100%{transform:translateY(0) rotate(0);}
    50%{transform:translateY(-25px) rotate(10deg);}
}

.container{
    width:min(92%,700px);
    margin:auto;
    padding:45px 0 60px;
    text-align:center;
}

.logo{
    font-size:28px;
    font-weight:900;
    margin-bottom:55px;
}

.logo span{
    color:#ff3f7f;
}

.envelope{
    font-size:75px;
    margin-bottom:15px;
    animation:pulse 2s infinite;
}

@keyframes pulse{
    50%{transform:scale(1.08);}
}

.small{
    color:#aaa;
    font-size:16px;
    margin-bottom:8px;
}

h1{
    font-size:clamp(32px,7vw,52px);
    margin-bottom:28px;
}

#receiver{
    color:#ff4f8b;
}

.open-box{
    padding:35px 25px;
    border-radius:30px;
    background:rgba(255,255,255,.07);
    border:1px solid rgba(255,255,255,.12);
    backdrop-filter:blur(15px);
    box-shadow:0 25px 70px rgba(0,0,0,.35);
}

.intro{
    font-size:20px;
    color:#ddd;
    line-height:1.8;
    margin-bottom:25px;
}

.open-btn{
    border:0;
    padding:17px 35px;
    border-radius:18px;
    color:white;
    font-size:19px;
    font-weight:bold;
    cursor:pointer;
    background:linear-gradient(135deg,#ff1769,#ff6294);
    box-shadow:0 12px 35px rgba(255,23,105,.35);
    transition:.25s;
}

.open-btn:hover{
    transform:translateY(-3px) scale(1.02);
}

.gift{
    display:none;
    margin-top:25px;
    animation:showGift .7s ease;
}

@keyframes showGift{
    from{
        opacity:0;
        transform:translateY(25px) scale(.97);
    }
    to{
        opacity:1;
        transform:none;
    }
}

.badge{
    display:inline-block;
    padding:9px 20px;
    margin-bottom:22px;
    border-radius:50px;
    background:rgba(255,63,127,.16);
    color:#ff78a5;
    font-weight:bold;
}

.message{
    font-size:clamp(20px,5vw,27px);
    line-height:1.9;
    white-space:pre-wrap;
    overflow-wrap:anywhere;
    margin:10px 0 25px;
}

#giftImage{
    display:none;
    width:100%;
    max-height:500px;
    object-fit:contain;
    border-radius:22px;
    margin:20px auto;
    background:rgba(0,0,0,.15);
}

.date{
    color:#aaa;
    margin:18px 0;
}

.from{
    margin-top:22px;
    color:#ccc;
}

.from b{
    color:#ff72a1;
    font-size:19px;
}

/* مشغل الأغنية داخل الصفحة */
.music{
    display:none;
    margin-top:30px;
    padding:20px;
    border-radius:22px;
    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.10);
}

.music-title{
    margin-bottom:15px;
    font-weight:bold;
}

audio{
    width:100%;
}

.share{
    margin-top:35px;
}

.share button{
    border:1px solid rgba(255,255,255,.15);
    background:rgba(255,255,255,.06);
    color:white;
    border-radius:15px;
    padding:13px 22px;
    cursor:pointer;
    font-size:16px;
}

.footer{
    margin-top:50px;
    color:#666;
    font-size:14px;
}

@media(max-width:500px){
    .container{
        padding-top:30px;
    }

    .logo{
        margin-bottom:35px;
    }

    .open-box{
        padding:28px 18px;
    }
}
</style>
</head>

<body>

<div class="hearts">
    <div class="heart">♡</div>
    <div class="heart">♡</div>
    <div class="heart">♡</div>
    <div class="heart">♡</div>
    <div class="heart">♡</div>
</div>

<main class="container">

    <div class="logo">
        LAHZA <span>♡</span> لحظة
    </div>

    <!-- قبل فتح الهدية -->
    <section id="closedGift">

        <div class="envelope">💌</div>

        <div class="small">
            عندك لحظة من شخص يفكر فيك
        </div>

        <h1>
            إلى <span id="receiverTop">شخص مميز</span> ♡
        </h1>

        <div class="open-box">

            <div class="intro">
                فيه شيء صغير انصنع مخصوص لك ♡
            </div>

            <button class="open-btn" onclick="openGift()">
                افتح هديتك ♡
            </button>

        </div>

    </section>


    <!-- بعد فتح الهدية -->
    <section id="gift" class="gift">

        <div class="small">
            هذه اللحظة إلى
        </div>

        <h1>
            <span id="receiver"></span> ♡
        </h1>

        <div class="open-box">

            <div id="occasion" class="badge"></div>

            <div id="message" class="message"></div>

            <img id="giftImage" alt="صورتك الخاصة">

            <div id="date" class="date"></div>

            <div class="from">
                من ♡ <b id="sender"></b>
            </div>

            <div id="musicBox" class="music">
                <div class="music-title">
                    🎵 أغنية لهاللحظة
                </div>

                <audio id="giftAudio" controls playsinline></audio>
            </div>

        </div>

        <div class="share">
            <button onclick="shareGift()">
                مشاركة اللحظة ♡
            </button>
        </div>

    </section>

    <div class="footer">
        صنعت بحب بواسطة LAHZA ♡
    </div>

</main>

<script>

/* قراءة البيانات من الرابط */
const params = new URLSearchParams(window.location.search);

/* وقراءة البيانات المحفوظة إذا كانت موجودة */
let saved = {};

try{
    saved = JSON.parse(localStorage.getItem("lahzaGift")) || {};
}catch(e){
    saved = {};
}

function getData(name){
    return params.get(name) || saved[name] || "";
}

const receiver = getData("receiver");
const sender = getData("sender");
const occasion = getData("occasion");
const message = getData("message");
const date = getData("date");

/* يدعم أكثر من اسم للصورة والأغنية */
const image =
    getData("image") ||
    getData("photo");

const music =
    getData("music") ||
    getData("song") ||
    getData("audio");


/* تعبئة البيانات */
document.getElementById("receiverTop").textContent =
    receiver || "شخص مميز";

document.getElementById("receiver").textContent =
    receiver || "شخص مميز";

document.getElementById("sender").textContent =
    sender || "شخص يحبك";

document.getElementById("message").textContent =
    message || "هذه اللحظة صنعت لك ♡";


/* المناسبة */
const occasionBox = document.getElementById("occasion");

if(occasion){
    occasionBox.textContent = occasion;
}else{
    occasionBox.style.display = "none";
}


/* التاريخ */
const dateBox = document.getElementById("date");

if(date){
    dateBox.textContent = "📅 " + date;
}else{
    dateBox.style.display = "none";
}


/* الصورة */
const giftImage = document.getElementById("giftImage");

if(image){
    giftImage.src = image;
    giftImage.style.display = "block";

    giftImage.onerror = function(){
        this.style.display = "none";
    };
}


/* الأغنية داخل الصفحة */
const musicBox = document.getElementById("musicBox");
const giftAudio = document.getElementById("giftAudio");

if(music){

    /*
    إذا كانت صفحة create.html ترسل رابط ملف صوتي مباشر
    مثل mp3 / m4a / wav، راح يشتغل هنا داخل الصفحة.
    */

    const lowerMusic = music.toLowerCase();

    if(
        lowerMusic.includes(".mp3") ||
        lowerMusic.includes(".m4a") ||
        lowerMusic.includes(".wav") ||
        lowerMusic.includes(".ogg") ||
        lowerMusic.startsWith("data:audio") ||
        lowerMusic.startsWith("blob:")
    ){
        giftAudio.src = music;
        musicBox.style.display = "block";
    }
}


/* فتح الهدية */
function openGift(){

    document.getElementById("closedGift").style.display = "none";

    const gift = document.getElementById("gift");

    gift.style.display = "block";

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });
}


/* مشاركة */
async function shareGift(){

    const shareData = {
        title:"لحظة خاصة ♡",
        text:"عندك لحظة خاصة تنتظرك ♡",
        url:window.location.href
    };

    try{

        if(navigator.share){
            await navigator.share(shareData);
        }else{
            await navigator.clipboard.writeText(window.location.href);
            alert("تم نسخ رابط اللحظة ♡");
        }

    }catch(e){
        console.log(e);
    }
}

</script>

</body>
</html>
