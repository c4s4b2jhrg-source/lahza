<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>لحظة خاصة 🤍 | LAHZA</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:
  radial-gradient(circle at top,#301126,#090914 55%);
  color:white;
  min-height:100vh;
  text-align:center;
  overflow-x:hidden;
}

.container{
  max-width:600px;
  margin:auto;
  padding:25px;
}

.logo{
  color:#ff5d91;
  font-size:24px;
  font-weight:bold;
  padding:25px;
}

.start{
  min-height:75vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
}

.envelope{
  font-size:90px;
  animation:float 2s ease-in-out infinite;
}

@keyframes float{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-12px)}
}

h1{
  font-size:34px;
}

.pink{
  color:#ff5d91;
}

button{
  border:0;
  background:#ff4f87;
  color:white;
  padding:16px 35px;
  border-radius:15px;
  font-size:18px;
  cursor:pointer;
  margin-top:20px;
}

.gift{
  display:none;
  animation:show 1s ease;
}

@keyframes show{
  from{
    opacity:0;
    transform:translateY(20px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

.card{
  background:white;
  color:#191923;
  padding:30px;
  border-radius:24px;
  margin:25px 0;
  box-shadow:0 15px 50px rgba(0,0,0,.25);
}

.message{
  font-size:20px;
  line-height:2;
  white-space:pre-wrap;
}

.occasion{
  color:#ff4f87;
  font-weight:bold;
  margin-bottom:20px;
}

.date{
  color:#888;
  margin-top:20px;
}

.from{
  font-weight:bold;
  color:#ff4f87;
  margin-top:25px;
}

.music{
  display:none;
  margin-top:20px;
}

.music a{
  display:inline-block;
  background:#161625;
  color:#fff;
  text-decoration:none;
  padding:13px 20px;
  border-radius:12px;
}

.heart{
  position:fixed;
  bottom:-30px;
  font-size:22px;
  animation:heart 6s linear infinite;
  pointer-events:none;
}

@keyframes heart{
  from{
    transform:translateY(0);
    opacity:1;
  }
  to{
    transform:translateY(-110vh);
    opacity:0;
  }
}

.footer{
  margin:40px 0;
  color:#888;
  font-size:13px;
}

</style>
</head>

<body>

<div class="logo">
LAHZA ♡ لحظة
</div>

<div class="container">

<div class="start" id="start">

  <div class="envelope">💌</div>

  <h1>
    عندك <span class="pink">لحظة</span> خاصة...
  </h1>

  <p id="welcome">
    في شخص مسوي لك شيء جميل 🤍
  </p>

  <button onclick="openGift()">
    افتح الرسالة 💗
  </button>

</div>


<div class="gift" id="gift">

  <h1 id="title">
    لحظة خاصة 🤍
  </h1>

  <div class="card">

    <div class="occasion" id="occasion"></div>

    <div class="message" id="message"></div>

    <div class="date" id="date"></div>

    <div class="music" id="music">
      <a id="song" target="_blank">
        🎵 افتح الأغنية
      </a>
    </div>

    <div class="from" id="from"></div>

  </div>

  <button onclick="shareGift()">
    شارك اللحظة 🤍
  </button>

  <div class="footer">
    صنعت بحب بواسطة LAHZA ♡
  </div>

</div>

</div>


<script>

const params =
new URLSearchParams(window.location.search);

const receiver =
params.get("receiver") || "شخص مميز";

const sender =
params.get("sender") || "";

const message =
params.get("message") ||
"في أحد يبي يقول لك إن وجودك جميل 🤍";

const occasion =
params.get("occasion") || "مفاجأة 🎁";

const date =
params.get("date") || "";

const song =
params.get("song") || "";


document.getElementById("welcome").innerText =
receiver + "، في شخص مسوي لك شيء مميز 👀";

document.getElementById("title").innerText =
"إلى " + receiver + " 🤍";

document.getElementById("message").innerText =
message;

document.getElementById("occasion").innerText =
occasion;

if(date){
document.getElementById("date").innerText =
"📅 " + date;
}

if(sender){
document.getElementById("from").innerText =
"من " + sender + " 🤍";
}

if(song){
document.getElementById("music").style.display =
"block";

document.getElementById("song").href =
song;
}


function openGift(){

document.getElementById("start").style.display =
"none";

document.getElementById("gift").style.display =
"block";

makeHearts();

}


function makeHearts(){

for(let i=0;i<15;i++){

setTimeout(()=>{

const heart =
document.createElement("div");

heart.className="heart";

heart.innerHTML =
Math.random()>.5 ? "♡" : "💗";

heart.style.left =
Math.random()*100+"vw";

heart.style.animationDuration =
(4+Math.random()*4)+"s";

document.body.appendChild(heart);

setTimeout(()=>{
heart.remove();
},8000);

},i*250);

}

}


function shareGift(){

if(navigator.share){

navigator.share({
title:"عندك لحظة خاصة 🤍",
url:window.location.href
});

}else{

navigator.clipboard.writeText(
window.location.href
);

alert("تم نسخ رابط اللحظة 🤍");

}

}

</script>

</body>
</html>
